    // ---------- PROCEDURAL CAN ELECTRICITY ENGINE ----------
    // Generates mathematically stable, organic yellow electricity wrapping around the 3D can.
    // - Two layers: Layer 0 (behind can, rendered to mainCanvas) and Layer 1 (in front of can, rendered to kallpaFrontCanvas).
    // - 4 asynchronous concurrent arc slots with staggered lifespans (no synchronous bursting).
    // - Full 360° coverage: upper crown (upward), base groundings (downward), lateral flanks, diagonal coils.
    // - Progressive growth (t0 to 0.38), steady linger (0.38 to 0.66), progressive tail retraction & fade-out (0.66 to 1.0).
    // - Origin point disappears completely on retraction before rebirth at a new location.
    // - ZERO dots / circles on turns or bends (no ctx.arc).

    class CanElectricArc {
      constructor(slotId, startDelay = 0) {
        this.slotId = slotId;
        this.t0 = performance.now() + startDelay;
        this.duration = 3200 + Math.random() * 1400; // 3.2s to 4.6s lifespan
        this.seed = Math.floor(Math.random() * 100000);
        this.zone = slotId % 6;
        this.buildPath();
      }

      reset(now, nextZone) {
        this.t0 = now;
        this.duration = 3000 + Math.random() * 1500;
        this.seed = Math.floor(Math.random() * 100000);
        this.zone = nextZone != null ? nextZone : Math.floor(Math.random() * 6);
        this.buildPath();
      }

      buildPath() {
        const z = this.zone;
        const r = rng(this.seed);

        let waypoints = [];
        // u in [-1.4, 1.4] relative to can half-width (125px)
        // v in [-1.2, 1.2] relative to can half-height (250px)
        // depth z: < 0 behind can (layer 0), >= 0 in front of can (layer 1)

        if (z === 0) {
          // Upper Crown (Shoulders & Lid sparking UPWARD and outward into air)
          const side = r() > 0.5 ? 1 : -1;
          waypoints = [
            { u: side * (0.3 + r() * 0.3), v: -0.72 + r() * 0.1, z: 0.2 },
            { u: side * (0.55 + r() * 0.35), v: -0.88 - r() * 0.15, z: -0.3 },
            { u: side * (0.8 + r() * 0.5), v: -1.05 - r() * 0.3, z: -0.8 },
            { u: side * (1.1 + r() * 0.6), v: -1.25 - r() * 0.45, z: -1.0 }
          ];
        } else if (z === 1) {
          // Downward Base Grounding (Striking DOWNWARD from bottom chime into the floor)
          const side = r() > 0.5 ? 1 : -1;
          waypoints = [
            { u: side * (0.2 + r() * 0.4), v: 0.78 + r() * 0.08, z: 0.4 },
            { u: side * (0.45 + r() * 0.4), v: 0.95 + r() * 0.12, z: 0.1 },
            { u: side * (0.7 + r() * 0.5), v: 1.15 + r() * 0.22, z: -0.4 },
            { u: side * (0.9 + r() * 0.6), v: 1.35 + r() * 0.35, z: -0.8 }
          ];
        } else if (z === 2) {
          // Diagonal Wrap Down (Upper-Left Behind -> Front Center -> Lower-Right Behind)
          const dir = r() > 0.5 ? 1 : -1;
          waypoints = [
            { u: -dir * (0.95 + r() * 0.2), v: -0.65 - r() * 0.2, z: -0.7 },
            { u: -dir * (0.6 + r() * 0.2), v: -0.35 + r() * 0.15, z: -0.1 },
            { u: 0.0 + (r() - 0.5) * 0.3, v: 0.0 + (r() - 0.5) * 0.2, z: 0.8 },
            { u: dir * (0.65 + r() * 0.2), v: 0.38 + r() * 0.15, z: 0.2 },
            { u: dir * (1.05 + r() * 0.25), v: 0.68 + r() * 0.2, z: -0.6 }
          ];
        } else if (z === 3) {
          // Diagonal Wrap Up (Lower-Left Behind -> Front Center -> Upper-Right Behind)
          const dir = r() > 0.5 ? 1 : -1;
          waypoints = [
            { u: -dir * (1.0 + r() * 0.2), v: 0.62 + r() * 0.18, z: -0.6 },
            { u: -dir * (0.55 + r() * 0.2), v: 0.28 + r() * 0.15, z: 0.2 },
            { u: 0.05 * dir, v: -0.05 + (r() - 0.5) * 0.2, z: 0.9 },
            { u: dir * (0.62 + r() * 0.2), v: -0.38 + r() * 0.15, z: 0.1 },
            { u: dir * (1.05 + r() * 0.25), v: -0.7 + r() * 0.18, z: -0.7 }
          ];
        } else if (z === 4) {
          // Left Lateral Rim & Flank Hugging Arc
          waypoints = [
            { u: -0.85 - r() * 0.15, v: -0.55 + r() * 0.15, z: -0.3 },
            { u: -1.02 - r() * 0.2, v: -0.15 + r() * 0.15, z: 0.2 },
            { u: -0.98 - r() * 0.18, v: 0.22 + r() * 0.15, z: 0.4 },
            { u: -0.88 - r() * 0.15, v: 0.6 + r() * 0.15, z: -0.2 }
          ];
        } else {
          // Right Lateral Rim & Flank Hugging Arc
          waypoints = [
            { u: 0.85 + r() * 0.15, v: -0.52 + r() * 0.15, z: -0.3 },
            { u: 1.02 + r() * 0.2, v: -0.12 + r() * 0.15, z: 0.2 },
            { u: 0.98 + r() * 0.18, v: 0.25 + r() * 0.15, z: 0.4 },
            { u: 0.88 + r() * 0.15, v: 0.62 + r() * 0.15, z: -0.2 }
          ];
        }

        // Subdivide waypoints into an angular parametric electric lightning path
        const pts = [];
        for (let i = 0; i < waypoints.length - 1; i++) {
          const p1 = waypoints[i];
          const p2 = waypoints[i + 1];
          const segs = 7 + Math.floor(r() * 4);
          const dx = p2.u - p1.u, dy = p2.v - p1.v, dz = p2.z - p1.z;
          const len = Math.hypot(dx, dy) || 1;
          const nx = -dy / len, ny = dx / len;

          for (let s = 0; s <= segs; s++) {
            if (i > 0 && s === 0) continue;
            const t = s / segs;
            // Deterministic angular displacement (no frame-by-frame noise)
            const env = Math.sin(t * Math.PI);
            const jitterAmp = (r() - 0.5) * 0.18 * env;
            const u = p1.u + dx * t + nx * jitterAmp;
            const v = p1.v + dy * t + ny * jitterAmp;
            const z = p1.z + dz * t;
            pts.push({ u, v, z });
          }
        }
        this.points = pts;

        // Create 1 or 2 small sub-branches (depth 1)
        this.branches = [];
        const numBranches = r() > 0.35 ? (r() > 0.65 ? 2 : 1) : 0;
        for (let b = 0; b < numBranches; b++) {
          const forkIdx = Math.floor(pts.length * (0.28 + r() * 0.45));
          const forkPt = pts[forkIdx];
          const nextPt = pts[Math.min(pts.length - 1, forkIdx + 1)];
          const bdx = nextPt.u - forkPt.u, bdy = nextPt.v - forkPt.v;
          const blen = Math.hypot(bdx, bdy) || 1;
          const angle = Math.atan2(bdy, bdx) + (r() > 0.5 ? 0.6 : -0.6) + (r() - 0.5) * 0.3;
          const branchLen = (0.25 + r() * 0.3);
          const bSegs = 4 + Math.floor(r() * 3);
          const bPts = [{ u: forkPt.u, v: forkPt.v, z: forkPt.z }];

          for (let s = 1; s <= bSegs; s++) {
            const bt = s / bSegs;
            const dist = branchLen * bt;
            const jit = (r() - 0.5) * 0.08 * Math.sin(bt * Math.PI);
            const bu = forkPt.u + Math.cos(angle) * dist - Math.sin(angle) * jit;
            const bv = forkPt.v + Math.sin(angle) * dist + Math.cos(angle) * jit;
            bPts.push({ u: bu, v: bv, z: forkPt.z });
          }
          this.branches.push({
            forkFrac: forkIdx / (pts.length - 1),
            points: bPts
          });
        }
      }

      render(ctx, targetLayer, now, cx, cy, canW, canH) {
        const elapsed = now - this.t0;
        if (elapsed < 0) return; // not yet born
        const prog = elapsed / this.duration;
        if (prog >= 1.0) {
          // Reincarnate at a new position
          this.reset(now + Math.random() * 250);
          return;
        }

        // Timeline phases:
        // 0.00 -> 0.38 : Growth (head advances from 0 to 1, tail at 0)
        // 0.38 -> 0.66 : Steady linger (head 1, tail 0, subtle harmonic vibration)
        // 0.66 -> 1.00 : Progressive tail retraction & fade (tail advances from 0 to 1, opacity fades out)
        let head = 1, tail = 0, alpha = 1;
        if (prog < 0.38) {
          head = prog / 0.38;
          tail = 0;
          alpha = Math.min(1, prog / 0.08);
        } else if (prog <= 0.66) {
          head = 1;
          tail = 0;
          alpha = 1;
        } else {
          head = 1;
          tail = (prog - 0.66) / 0.34;
          alpha = Math.max(0, 1 - tail);
        }

        if (alpha <= 0.005 || tail >= head) return;

        // Subtle micro-pulse
        const pulse = 1.0 + 0.12 * Math.sin(now * 0.015 + this.seed);
        const curAlpha = Math.min(1, alpha * pulse);

        const totalPts = this.points.length;
        const startIdx = Math.max(0, Math.floor(tail * (totalPts - 1)));
        const endIdx = Math.min(totalPts - 1, Math.ceil(head * (totalPts - 1)));
        if (endIdx <= startIdx) return;

        // Draw primary backbone path filtered by layer
        this.renderSegmentList(ctx, targetLayer, this.points, startIdx, endIdx, curAlpha, cx, cy, canW, canH, 1.0);

        // Draw branches if growth has reached their fork point
        for (const br of this.branches) {
          if (head >= br.forkFrac && tail < br.forkFrac) {
            const brProg = Math.min(1, (head - br.forkFrac) / 0.25);
            const brTail = Math.min(1, Math.max(0, (tail - br.forkFrac) / 0.25));
            const brEndIdx = Math.min(br.points.length - 1, Math.ceil(brProg * (br.points.length - 1)));
            const brStartIdx = Math.max(0, Math.floor(brTail * (br.points.length - 1)));
            if (brEndIdx > brStartIdx) {
              this.renderSegmentList(ctx, targetLayer, br.points, brStartIdx, brEndIdx, curAlpha * 0.85, cx, cy, canW, canH, 0.7);
            }
          }
        }
      }

      renderSegmentList(ctx, targetLayer, ptsList, startIdx, endIdx, alpha, cx, cy, canW, canH, scaleWidth) {
        const halfW = canW * 0.5;
        const halfH = canH * 0.5;

        let currentRun = [];
        for (let i = startIdx; i < endIdx; i++) {
          const p1 = ptsList[i];
          const p2 = ptsList[i + 1];
          const avgZ = (p1.z + p2.z) * 0.5;
          const isTarget = targetLayer === 0 ? (avgZ < 0.05) : (avgZ >= 0.05);

          if (isTarget) {
            if (currentRun.length === 0) {
              currentRun.push({ x: cx + p1.u * halfW, y: cy + p1.v * halfH });
            }
            currentRun.push({ x: cx + p2.u * halfW, y: cy + p2.v * halfH });
          } else {
            if (currentRun.length > 1) {
              this.strokePath(ctx, currentRun, alpha, scaleWidth);
            }
            currentRun = [];
          }
        }

        if (currentRun.length > 1) {
          this.strokePath(ctx, currentRun, alpha, scaleWidth);
        }
      }

      strokePath(ctx, path, alpha, scaleWidth) {
        if (path.length < 2) return;

        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'miter';
        ctx.miterLimit = 3;

        // 1. Soft Amber/Yellow Ambient Glow
        ctx.beginPath();
        ctx.moveTo(path[0].x, path[0].y);
        for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
        ctx.strokeStyle = `rgba(255, 213, 0, ${(0.18 * alpha).toFixed(3)})`;
        ctx.lineWidth = 7.0 * scaleWidth;
        ctx.stroke();

        // 2. High-energy Yellow Mid-Stroke (#FFD500)
        ctx.beginPath();
        ctx.moveTo(path[0].x, path[0].y);
        for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
        ctx.strokeStyle = `rgba(255, 213, 0, ${(0.9 * alpha).toFixed(3)})`;
        ctx.lineWidth = 2.4 * scaleWidth;
        ctx.stroke();

        // 3. Crisp Pure Core (#FFF8CC / White core, 1.1px)
        ctx.beginPath();
        ctx.moveTo(path[0].x, path[0].y);
        for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
        ctx.strokeStyle = `rgba(255, 250, 220, ${(0.95 * alpha).toFixed(3)})`;
        ctx.lineWidth = 1.1 * scaleWidth;
        ctx.stroke();

        ctx.restore();
      }
    }

        // Interaction state
        this.isDragging = false;
        this.dragStartX = 0;
        this.dragStartRot = 0;
        this.lastDragX = 0;
        this.lastDragTime = 0;

        this.tiltX = 0;
        this.tiltY = 0;
        this.targetTiltX = 0;
        this.targetTiltY = 0;

        this.initialized = false;
        this.initThree();
        this.bindEvents();
      }

      initThree() {
        if (typeof THREE === 'undefined' || !this.canvas) return;

        this.width = 500;
        this.height = 1000;
        this.aspect = 0.5;

        this.config = {
          cylTop: 0.092,
          cylBot: 0.925,
          cylWidth: 0.764,
          cylCurv: 2.2,
          lightInt: 1.8,
          lightAmb: 0.45,
          lightX: -0.9
        };

        // Render directly into the visible canvas with hardware WebGL
        this.renderer = new THREE.WebGLRenderer({
          canvas: this.canvas,
          alpha: true,
          antialias: true,
          powerPreference: 'high-performance'
        });
        this.renderer.setSize(this.width, this.height, false);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

        this.scene = new THREE.Scene();

        const camW = this.aspect;
        const camH = 1.0;
        this.camera = new THREE.OrthographicCamera(
          -camW / 2, camW / 2,
          camH / 2, -camH / 2,
          0.01, 10
        );
        this.camera.position.z = 5;

        // Lights calibrated for metallic aluminum
        const ambientLight = new THREE.AmbientLight(0xffffff, this.config.lightAmb);
        this.scene.add(ambientLight);

        const spotLight = new THREE.SpotLight(0xfff8ee, this.config.lightInt * 3.2);
        spotLight.position.set(this.config.lightX, 0.8, 1.5);
        spotLight.angle = Math.PI / 3.2;
        spotLight.penumbra = 0.75;
        spotLight.decay = 1.2;
        spotLight.distance = 8;
        this.scene.add(spotLight);
        this.scene.add(spotLight.target);
        spotLight.target.position.set(0, -0.05, 0);

        const leftAmberRim = new THREE.DirectionalLight(0xf59e0b, 1.8);
        leftAmberRim.position.set(-1.8, 0.2, 0.5);
        this.scene.add(leftAmberRim);

        const rightAmberRim = new THREE.DirectionalLight(0xea580c, 1.4);
        rightAmberRim.position.set(1.8, -0.2, 0.5);
        this.scene.add(rightAmberRim);

        const frontFill = new THREE.DirectionalLight(0xffffff, 0.5);
        frontFill.position.set(0, 0, 2);
        this.scene.add(frontFill);

        // Cylindrical Lathe Geometry accurately contoured to the can's shoulder & base
        const totalH = this.config.cylBot - this.config.cylTop;
        const bodyRadius = (this.config.cylWidth * this.aspect) / 2;
        const neckRadius = 0.154;
        const chimeRadius = 0.182;

        const points = [];
        const steps = 60;
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          let r = bodyRadius;
          if (t > 0.82) {
            const st = (t - 0.82) / 0.18;
            const curve = st * st * (3.0 - 2.0 * st);
            r = bodyRadius - (bodyRadius - neckRadius) * curve;
          } else if (t < 0.08) {
            const bt = (0.08 - t) / 0.08;
            r = bodyRadius - (bodyRadius - chimeRadius) * bt;
          }
          points.push(new THREE.Vector2(r, (t - 0.5) * totalH));
        }

        const geometry = new THREE.LatheGeometry(points, 128);
        this.mesh = new THREE.Mesh(geometry);
        this.mesh.position.y = 0.5 - (this.config.cylTop + this.config.cylBot) / 2;
        this.mesh.rotation.x = (this.config.cylCurv * Math.PI) / 180;
        this.scene.add(this.mesh);

        // Texture loader for Kallpa original label
        this.textureLoader = new THREE.TextureLoader();
        this.uOffset = { value: this.rotOffset };

        this.labelTexture = this.textureLoader.load(KALLPA_LABEL_URL, (tex) => {
          tex.wrapS = THREE.RepeatWrapping;
          tex.wrapT = THREE.ClampToEdgeWrapping;
          if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
          tex.generateMipmaps = true;
          tex.needsUpdate = true;
        });
        this.labelTexture.wrapS = THREE.RepeatWrapping;
        this.labelTexture.wrapT = THREE.ClampToEdgeWrapping;

        const material = new THREE.MeshStandardMaterial({
          map: this.labelTexture,
          side: THREE.FrontSide,
          roughness: 0.28,
          metalness: 0.30,
          transparent: true
        });

        material.onBeforeCompile = (shader) => {
          shader.uniforms.uOffset = this.uOffset;
          shader.fragmentShader = shader.fragmentShader.replace(
            '#include <common>',
            `#include <common>
            uniform float uOffset;`
          );
          const uvVar = shader.fragmentShader.includes('vMapUv') ? 'vMapUv' : 'vUv';
          shader.fragmentShader = shader.fragmentShader.replace(
            '#include <map_fragment>',
            `
            #ifdef USE_MAP
              float _u = fract(${uvVar}.x + uOffset);
              vec4 sampledDiffuseColor = texture2D(map, vec2(_u, ${uvVar}.y));
              sampledDiffuseColor.rgb = pow(sampledDiffuseColor.rgb, vec3(1.15));
              float edgeSoftness = smoothstep(1.0, 0.982, ${uvVar}.y) * smoothstep(0.0, 0.015, ${uvVar}.y);
              sampledDiffuseColor.a *= edgeSoftness;
              diffuseColor *= sampledDiffuseColor;
            #endif
            `
          );
        };

        this.mesh.material = material;
        this.initialized = true;
      }

      bindEvents() {
        if (!this.card) return;

        const onStart = (clientX) => {
          this.isDragging = true;
          this.dragStartX = clientX;
          this.dragStartRot = this.rotOffset;
          this.lastDragX = clientX;
          this.lastDragTime = performance.now();
          this.rotVelocity = 0;
        };

        const onMove = (clientX, clientY) => {
          if (this.isDragging) {
            const dx = clientX - this.dragStartX;
            this.rotOffset = ((this.dragStartRot - dx * 0.0025) % 1.0 + 1.0) % 1.0;
            const now = performance.now();
            const dt = Math.max(1, now - this.lastDragTime);
            this.rotVelocity = -((clientX - this.lastDragX) * 0.0025) / dt * 16;
            this.lastDragX = clientX;
            this.lastDragTime = now;
          }

          // Tilt towards cursor
          const rect = this.card.getBoundingClientRect();
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          this.targetTiltY = ((clientX - cx) / (window.innerWidth * 0.5)) * 14;
          this.targetTiltX = -((clientY - cy) / (window.innerHeight * 0.5)) * 10;
        };

        const onEnd = () => {
          this.isDragging = false;
        };

        this.card.addEventListener('mousedown', e => onStart(e.clientX));
        window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
        window.addEventListener('mouseup', onEnd);

        this.card.addEventListener('touchstart', e => {
          if (e.touches.length > 0) onStart(e.touches[0].clientX);
        }, { passive: true });
        window.addEventListener('touchmove', e => {
          if (e.touches.length > 0) onMove(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });
        window.addEventListener('touchend', onEnd);
      }

      update(now, dt) {
        if (!this.initialized || state.theme !== 'kallpa') return;

        // Damping and continuous ambient rotation
        if (!this.isDragging) {
          this.rotVelocity *= Math.pow(0.92, dt / 16);
          const ambientSpeed = 0.00016; // Continuous smooth spin
          this.rotOffset = ((this.rotOffset + this.rotVelocity + ambientSpeed * dt) % 1.0 + 1.0) % 1.0;
        }

        // Apply rotation to shader uniform and texture offset
        this.uOffset.value = this.rotOffset;
        if (this.labelTexture) {
          this.labelTexture.offset.x = this.rotOffset;
        }
        this.mesh.rotation.y = this.rotOffset * Math.PI * 2;

        // Smooth tilt and floating vertical bob
        const k = 1 - Math.exp(-dt / 80);
        this.tiltX += (this.targetTiltX - this.tiltX) * k;
        this.tiltY += (this.targetTiltY - this.tiltY) * k;
        const bob = Math.sin(now * 0.0016) * 7;

        this.card.style.transform = `translateY(${bob.toFixed(2)}px) rotateX(${this.tiltX.toFixed(2)}deg) rotateY(${this.tiltY.toFixed(2)}deg)`;

        // Render directly to WebGL canvas
        this.renderer.render(this.scene, this.camera);
      }
    }

    let kallpaExperience = null;

    const setText = str => {
      letters = [];
      const t = performance.now();
      for (let i = 0; i < str.length; i++) {
        addLetter(str[i], t + i * 40);
      }
      hiddenInput.value = str;
      layout();
    };

    const updateHintsUI = () => {
      if (state.theme === 'kallpa') {
        hintType.textContent = 'lata 3d kallpa';
        hintTap.textContent = 'arrastra para rotar la lata';
        hintCut.textContent = 'electricidad procedural';
        hintWither.textContent = 'rotación continua 360°';
        hintWitherC.textContent = '360°';
        hintClear.textContent = 'energía andina';
        hintClearC.textContent = 'kallpa';
      } else if (state.theme === 'electric') {
        hintType.textContent = 'type to spark';
        hintTap.textContent = 'tap to spark';
        hintCut.textContent = 'space discharges';
        hintWither.textContent = 'backspace snaps';
        hintWitherC.textContent = '⌫ snaps';
        hintClear.textContent = 'enter grounds';
        hintClearC.textContent = 'return grounds';
      } else {
        hintType.textContent = 'type to grow';
        hintTap.textContent = 'tap to type';
        hintCut.textContent = 'space cuts';
        hintWither.textContent = 'backspace withers';
        hintWitherC.textContent = '⌫ withers';
        hintClear.textContent = 'enter clears';
        hintClearC.textContent = 'return clears';
      }
    };

    const setTheme = theme => {
      state.theme = theme;
      state.palette = 0;
      state.preset = 'breathe';

      if (theme === 'kallpa') {
        btnThemeGarden.className = 'theme-btn garden';
        btnThemeElectric.className = 'theme-btn electric';
        btnThemeKallpa.className = 'theme-btn active kallpa';
        kallpaStage.style.display = 'flex';
        typeBar.style.display = 'none';
        document.title = 'Kallpa Energy • Lata 3D';
        letters = []; // Pure can focus: no letters behind can
      } else if (theme === 'electric') {
        btnThemeGarden.className = 'theme-btn garden';
        btnThemeElectric.className = 'theme-btn active electric';
        btnThemeKallpa.className = 'theme-btn kallpa';
        kallpaStage.style.display = 'none';
        if (state.mode === 'type') typeBar.style.display = 'flex';
        document.title = 'Líneas Eléctricas';
        if (letters.filter(l => !l.dead).length === 0) setText('sparawaw');
      } else {
        btnThemeGarden.className = 'theme-btn active garden';
        btnThemeElectric.className = 'theme-btn electric';
        btnThemeKallpa.className = 'theme-btn kallpa';
        kallpaStage.style.display = 'none';
        if (state.mode === 'type') typeBar.style.display = 'flex';
        document.title = 'Type Garden';
        if (letters.filter(l => !l.dead).length === 0) setText('sparawaw');
      }

      updateHintsUI();
      updatePaletteUI();
      updatePresetUI();

      // Re-initialize letters for the selected theme
      letters.forEach(l => {
        if (l.ch !== ' ') gen(l);
      });
      layout();
      if (state.mode === 'poster') buildPoster();
      refocus();
    };

    const setMode = mode => {
      state.mode = mode;
      if (mode === 'type') {
        btnModeType.classList.add('active');
        btnModePoster.classList.remove('active');
        mainCanvas.style.display = 'block';
        peersContainer.style.display = 'block';
        typeBar.style.display = 'flex';
        posterView.style.display = 'none';
        appEl.style.cursor = 'text';
        resize();
        refocus();
      } else {
        btnModeType.classList.remove('active');
        btnModePoster.classList.add('active');
        mainCanvas.style.display = 'none';
        peersContainer.style.display = 'none';
        typeBar.style.display = 'none';
        posterView.style.display = 'grid';
        appEl.style.cursor = 'default';
        const currentTypedText = letters.filter(l => !l.dead).map(l => l.ch).join('').trim();
        if (currentTypedText) {
          state.text = currentTypedText;
          posterTextInput.value = currentTypedText;
        }
        buildPoster();
      }
    };

    // Event Bindings
    btnThemeGarden.onclick = () => setTheme('garden');
    btnThemeElectric.onclick = () => setTheme('electric');
    btnThemeKallpa.onclick = () => setTheme('kallpa');
    btnModeType.onclick = () => setMode('type');
    btnModePoster.onclick = () => setMode('poster');

    posterTextInput.oninput = e => {
      state.text = e.target.value;
      buildPoster();
    };

    btnReshuffle.onclick = () => {
      state.seed = Math.floor(Math.random() * 1e6);
      buildPoster();
    };

    btnExportVideo.onclick = exportVideo;
    btnExportFrames.onclick = exportFrames;
    btnSavePNG.onclick = savePNG;
    btnSaveSVG.onclick = saveSVG;

    window.addEventListener('resize', resize);
    window.addEventListener('keydown', handleKey);

    window.addEventListener('pointermove', e => {
      mx = e.clientX;
      my = e.clientY;
    });

    document.addEventListener('pointerleave', () => {
      mx = null;
      if (net && others > 0) net.send('p', { i: me.id, h: 1 });
    });

    window.addEventListener('pointerdown', e => {
      ptype = e.pointerType || 'mouse';
      if (state.mode !== 'type') return;
      const isCanvas = e.target === mainCanvas;
      if (isCanvas) {
        spawnFly(e.clientX, e.clientY);
        // Double-click/tap leaves gift
        const now = performance.now(), lp = lastTap;
        lastTap = { t: now, x: e.clientX, y: e.clientY };
        if (lp && now - lp.t < 340 && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) < 40 && now - lastPlant > 1800) {
          lastPlant = now; lastTap = null;
          const g_gift = {
            x: Math.round(e.clientX / W * 1000) / 1000,
            y: Math.round(e.clientY / H * 1000) / 1000,
            s: Math.floor(Math.random() * 1e6)
          };
          liveRose(g_gift);
          if (net) net.send('r', g_gift);
        }
      }
      if (e.target.closest('button') || e.target.closest('input')) return;
      if (hiddenInput && ptype === 'mouse') hiddenInput.focus({ preventScroll: true });
    }, true);

    window.addEventListener('pointerup', e => {
      if (e.pointerType && e.pointerType !== 'mouse') mx = null;
    });
    window.addEventListener('pointercancel', e => {
      if (e.pointerType && e.pointerType !== 'mouse') mx = null;
    });

    hiddenInput.addEventListener('input', e => inputDiff(e.target));
    hiddenInput.addEventListener('compositionstart', () => { composing = true; });
    hiddenInput.addEventListener('compositionend', () => {
      composing = false;
      setTimeout(() => inputDiff(hiddenInput), 0);
    });

    // Touch device support & Visual Viewport
    if (touch) document.documentElement.setAttribute('data-touch', '');
    if (window.visualViewport && touch) {
      let vvMax = 0;
      const syncVV = () => {
        const vv = window.visualViewport;
        vvMax = Math.max(vvMax, vv.height);
        const kb = vvMax - vv.height > 120;
        document.documentElement.style.setProperty('--tg-top', vv.offsetTop + 'px');
        document.documentElement.style.setProperty('--tg-h', vv.height + 'px');
        if (kb) document.documentElement.setAttribute('data-kb', '');
        else document.documentElement.removeAttribute('data-kb');
        resize();
      };
      window.visualViewport.addEventListener('resize', syncVV);
      window.visualViewport.addEventListener('scroll', syncVV);
      syncVV();
    }

    // Video button label update
    btnExportVideo.textContent = vmime ? `Export ${vmime.includes('mp4') ? 'MP4' : 'WebM'} loop` : 'Video export unavailable';
    if (!vmime) btnExportVideo.disabled = true;

    // ---------- INITIALIZATION ----------
    try {
      canElectricEngine = new CanElectricEngine();
      kallpaExperience = new KallpaCanExperience();
    } catch (err) {
      console.warn('Experience init error:', err);
    }

    setTheme('electric'); // Start in electric theme
    hiddenInput.value = SENT;
    resize();
    liveInit();
    buildPoster();

    // Load fonts and recalculate
    if (document.fonts) {
      document.fonts.load(`700 100px ${FONT_FAMILY}`).then(() => {
        cache = {};
        layout();
        buildPoster();
      }).catch(() => {});
    }

    // Initial word (matches the editorial reference image)
    const initialWord = "sparawaw";
    const initT = performance.now();
    for (let i = 0; i < initialWord.length; i++) {
      addLetter(initialWord[i], initT);
    }

    requestAnimationFrame(frame);
    setTimeout(() => { if (!touch && hiddenInput) hiddenInput.focus({ preventScroll: true }); }, 100);

  })();
  </script>
</body>
</html>
