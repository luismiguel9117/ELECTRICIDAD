<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Type Garden & Electricity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: #000;
      overflow: hidden;
      overscroll-behavior: none;
      font-family: 'DM Mono', ui-monospace, monospace;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #fff; text-decoration: none; }
    a:hover { color: #FFB4A8; }
    input[type=range] { accent-color: #FFFFFF; }
    button {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    [data-tg="app"] {
      position: fixed;
      inset: 0;
      background: #000;
      cursor: text;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      transition: background 0.25s ease;
    }

    html[data-touch] [data-tg="app"] {
      touch-action: none;
      top: var(--tg-top, 0px) !important;
      bottom: auto !important;
      height: var(--tg-h, 100%) !important;
    }

    #mainCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    [data-tg="peers"] {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 4;
    }

    [data-tg="input"] {
      position: fixed;
      left: 0;
      top: 0;
      width: 1px;
      height: 1px;
      margin: 0;
      padding: 0;
      border: 0;
      opacity: 0;
      font-size: 16px;
      color: transparent;
      background: transparent;
      caret-color: transparent;
      pointer-events: none;
    }

    /* Top Left: Theme Switcher */
    [data-tg="themes"] {
      position: absolute;
      top: calc(16px + env(safe-area-inset-top));
      left: calc(24px + env(safe-area-inset-left));
      z-index: 10;
      display: flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid #2A2A2A;
      border-radius: 999px;
      background: #000000d0;
      backdrop-filter: blur(10px);
    }

    .theme-btn {
      border: 0;
      border-radius: 999px;
      padding: 7px 15px;
      font-size: 12px;
      letter-spacing: 0.04em;
      cursor: pointer;
      background: transparent;
      color: #8C8C8C;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }
    .theme-btn:hover {
      color: #FFF;
    }
    .theme-btn.active.garden {
      background: #FFFFFF;
      color: #000000;
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.25);
    }
    .theme-btn.active.electric {
      background: #FFE600;
      color: #000000;
      box-shadow: 0 0 16px rgba(255, 230, 0, 0.6);
    }

    /* Top Right: Mode Switcher */
    [data-tg="modes"] {
      position: absolute;
      top: calc(16px + env(safe-area-inset-top));
      right: calc(16px + env(safe-area-inset-right));
      z-index: 10;
      display: flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid #2A2A2A;
      border-radius: 999px;
      background: #000000d0;
      backdrop-filter: blur(10px);
    }

    .mode-btn {
      border: 0;
      border-radius: 999px;
      padding: 7px 16px;
      font-size: 12px;
      letter-spacing: 0.04em;
      cursor: pointer;
      background: transparent;
      color: #8C8C8C;
      transition: all 0.2s ease;
    }
    .mode-btn.active {
      background: #FFFFFF;
      color: #000000;
      font-weight: 500;
    }

    [data-tg="bar"] {
      position: absolute;
      left: calc(24px + env(safe-area-inset-left));
      right: calc(24px + env(safe-area-inset-right));
      bottom: calc(20px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: #FFFFFF;
      opacity: 0.85;
      z-index: 5;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    [data-tg="bar"] > * {
      pointer-events: auto;
    }

    [data-tg="hints"] {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      align-items: center;
      user-select: none;
      opacity: 0.75;
    }

    [data-tg="coarse"] { display: none; }
    @media (pointer: coarse) {
      [data-tg="fine"] { display: none; }
      [data-tg="coarse"] { display: inline; }
    }

    [data-tg="count"]:empty { display: none; }
    [data-tg="count"]::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      margin-right: 8px;
      vertical-align: 1px;
      animation: tg-live 2.4s ease-in-out infinite;
    }
    @keyframes tg-live {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    [data-tg="ctrls"] {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    [data-tg="pal"] {
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 4px 6px;
      border: 1px solid #3A3A3A;
      border-radius: 999px;
      background: #000;
    }

    .swatch-btn {
      width: 22px;
      height: 22px;
      padding: 0;
      border-radius: 999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, border-color 0.2s;
      outline: none;
    }
    .swatch-btn:hover {
      transform: scale(1.15);
    }
    .swatch-btn.active {
      transform: scale(1.1);
    }
    .swatch-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
    }

    .action-btn {
      background: transparent;
      border: 1px solid #3A3A3A;
      color: #BDBDBD;
      font: inherit;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .action-btn:hover {
      border-color: #FFFFFF;
      color: #FFFFFF;
    }

    /* Poster Mode Layout */
    [data-tg="poster"] {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: minmax(300px, 350px) minmax(0, 1fr);
      background: #000;
      cursor: default;
      color: #EDEDED;
      font-size: 12px;
      letter-spacing: 0.03em;
      z-index: 8;
    }

    [data-tg="panel"] {
      border-right: 1px solid #1E1E1E;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 28px 24px 36px;
      display: flex;
      flex-direction: column;
      gap: 26px;
      background: #0A0A0A;
    }

    .poster-heading {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 28px;
      letter-spacing: 0;
      color: #FFFFFF;
    }

    .section-title {
      color: #8C8C8C;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.08em;
      margin-bottom: 2px;
    }

    .poster-input {
      background: #000;
      border: 1px solid #2A2A2A;
      border-radius: 10px;
      color: #FFFFFF;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 22px;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .poster-input:focus {
      border-color: #FFFFFF;
    }

    .preset-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .preset-card {
      text-align: left;
      background: transparent;
      border: 1px solid #2A2A2A;
      color: #FFFFFF;
      font: inherit;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: all 0.2s ease;
    }
    .preset-card:hover {
      border-color: #666;
    }
    .preset-card.active {
      background: #161616;
      border-color: #FFFFFF;
    }
    .preset-card .title { font-size: 13px; font-weight: 500; }
    .preset-card .sub { color: #8C8C8C; font-size: 11px; }

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .palette-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: stretch;
      background: transparent;
      border: 1px solid #2A2A2A;
      color: #EDEDED;
      font: inherit;
      padding: 6px 6px 8px;
      border-radius: 12px;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.2s ease;
    }
    .palette-card:hover {
      border-color: #8C8C8C;
    }
    .palette-card.active {
      border-color: #FFFFFF;
    }
    .palette-card-preview {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      border-radius: 8px;
    }
    .palette-flower-circle {
      width: 18px;
      height: 18px;
      border-radius: 50%;
    }
    .palette-stem-circle {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-left: -4px;
    }
    .palette-type-preview {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 18px;
      margin-left: 8px;
    }

    .export-primary-btn {
      background: #FFFFFF;
      border: 0;
      color: #000;
      font: inherit;
      font-weight: 500;
      padding: 12px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .export-primary-btn:hover:not(:disabled) {
      opacity: 0.9;
    }
    .export-primary-btn:disabled, .action-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    [data-tg="stage"] {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 56px 32px 32px;
      min-width: 0;
    }

    #posterCanvas {
      width: min(100%, calc(100vh - 96px));
      height: auto;
      aspect-ratio: 1 / 1;
      display: block;
      border: 1px solid #1E1E1E;
      background: #000;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    }

    /* Peer cursors */
    .tg-peer {
      position: absolute;
      left: 0;
      top: 0;
      will-change: transform;
      transition: opacity 0.45s;
      font-family: 'DM Mono', ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.04em;
      line-height: 1;
      pointer-events: none;
    }
    .tg-peer svg { display: block; overflow: visible; }
    .tg-peer span {
      position: absolute;
      left: 14px;
      top: 18px;
      padding: 4px 8px;
      border-radius: 999px;
      color: #000;
      white-space: nowrap;
      font-weight: 500;
    }

    @media (max-width: 768px) {
      [data-tg="themes"] {
        left: calc(16px + env(safe-area-inset-left)) !important;
        top: calc(16px + env(safe-area-inset-top)) !important;
      }
      [data-tg="bar"] {
        left: calc(16px + env(safe-area-inset-left)) !important;
        right: calc(16px + env(safe-area-inset-right)) !important;
        bottom: calc(14px + env(safe-area-inset-bottom)) !important;
        gap: 10px !important;
      }
      [data-tg="hints"] { gap: 10px !important; font-size: 11px; }
      [data-tg="ctrls"] { flex: 1 1 100%; justify-content: space-between; gap: 8px !important; }
      [data-tg="pal"] { gap: 4px !important; }
      .swatch-btn {
        width: clamp(14px, calc((100vw - 190px) / 10), 22px);
        height: clamp(14px, calc((100vw - 190px) / 10), 22px);
      }
      .swatch-dot { width: 46%; height: 46%; }
      .action-btn { padding: 7px 11px !important; font-size: 11px; }
      .theme-btn { padding: 6px 10px; font-size: 11px; }
      .mode-btn { padding: 6px 12px; font-size: 11px; }

      [data-tg="poster"] {
        display: flex !important;
        flex-direction: column;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
      }
      [data-tg="poster"]::before {
        content: "";
        order: -2;
        position: sticky;
        top: 0;
        flex: none;
        height: calc(60px + env(safe-area-inset-top));
        margin-bottom: calc(-60px - env(safe-area-inset-top));
        background: linear-gradient(#000 62%, rgba(0,0,0,0));
        z-index: 4;
        pointer-events: none;
      }
      [data-tg="stage"] {
        order: -1;
        flex: none;
        padding: calc(64px + env(safe-area-inset-top)) 16px 12px !important;
      }
      #posterCanvas {
        width: 100% !important;
        max-width: 520px;
      }
      [data-tg="panel"] {
        flex: none;
        border-right: 0 !important;
        border-top: 1px solid #1E1E1E;
        overflow: visible !important;
        padding: 20px 16px calc(32px + env(safe-area-inset-bottom)) !important;
      }
    }
  </style>
</head>
<body>
  <div data-tg="app" id="app">
    <canvas id="mainCanvas"></canvas>
    <div data-tg="peers" id="peersContainer" aria-hidden="true"></div>
    <input id="hiddenInput" data-tg="input" aria-label="Type here" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">

    <!-- Concept / Theme Selector (Garden vs Electricity) -->
    <div data-tg="themes">
      <button class="theme-btn active garden" id="btnThemeGarden">🌸 Garden</button>
      <button class="theme-btn" id="btnThemeElectric">⚡ Electricity</button>
    </div>

    <!-- Mode Selector -->
    <div data-tg="modes">
      <button class="mode-btn active" id="btnModeType">Type</button>
      <button class="mode-btn" id="btnModePoster">Poster</button>
    </div>

    <!-- Type Bar (Bottom UI) -->
    <div data-tg="bar" id="typeBar">
      <div data-tg="hints" id="hintsContainer">
        <span data-tg="fine" id="hintType">type to grow</span>
        <span data-tg="coarse" id="hintTap">tap to type</span>
        <span id="hintCut">space cuts</span>
        <span data-tg="fine" id="hintWither">backspace withers</span>
        <span data-tg="coarse" id="hintWitherC">⌫ withers</span>
        <span data-tg="fine" id="hintClear">enter clears</span>
        <span data-tg="coarse" id="hintClearC">return clears</span>
        <span data-tg="count" id="gardenerCount"></span>
      </div>
      <div data-tg="ctrls">
        <div data-tg="pal" id="paletteBar"></div>
        <button class="action-btn" id="btnSavePNG">PNG</button>
        <button class="action-btn" id="btnSaveSVG">SVG</button>
      </div>
    </div>

    <!-- Poster View (Initially Hidden) -->
    <div data-tg="poster" id="posterView" style="display: none;">
      <div data-tg="panel">
        <div style="display:flex; flex-direction:column; gap:4px">
          <div class="poster-heading" id="posterTitle">Poster</div>
          <div style="color:#8C8C8C" id="posterInfoLabel">1:1 · 3s loop · 30 fps</div>
        </div>

        <div style="display:flex; flex-direction:column; gap:10px">
          <div class="section-title">Words</div>
          <input class="poster-input" id="posterTextInput" value="electric" spellcheck="false">
          <button class="action-btn" id="btnReshuffle" style="align-self: flex-start;">Regenerate</button>
        </div>

        <div style="display:flex; flex-direction:column; gap:10px">
          <div class="section-title">Motion</div>
          <div class="preset-grid" id="presetGrid"></div>
        </div>

        <div style="display:flex; flex-direction:column; gap:10px">
          <div class="section-title">Palette</div>
          <div class="palette-grid" id="posterPaletteGrid"></div>
        </div>

        <div style="display:flex; flex-direction:column; gap:10px; border-top:1px solid #1E1E1E; padding-top:20px">
          <div class="section-title">Export · 1080 × 1080 loop</div>
          <button class="export-primary-btn" id="btnExportVideo">Export MP4 loop</button>
          <button class="action-btn" id="btnExportFrames">PNG frames (.zip)</button>
          <div style="color:#8C8C8C; min-height:16px; font-size:11px" id="exportStatus"></div>
        </div>
      </div>

      <div data-tg="stage">
        <canvas id="posterCanvas" width="1080" height="1080"></canvas>
      </div>
    </div>
  </div>

  <script>
  (function() {
    'use strict';

    // ---------- PALETTES & PRESETS: GARDEN ----------
    const PAL_GARDEN = [
      ['Rose noir', '#000000', '#FF1400', '#3257FF', '#FFB4A8', '#FFFFFF'],
      ['Paper',     '#F3EEE4', '#FF3B1F', '#1C2B8F', '#FFD2C4', '#111111'],
      ['Midnight',  '#0D1B4C', '#FF5A4E', '#9FB4FF', '#FFD6CF', '#FFFFFF'],
      ['Citrus',    '#0E1A12', '#FF8A00', '#1FA463', '#FFE2B8', '#FFF6E8'],
      ['Orchid',    '#140A1F', '#E63CFF', '#2FB8A6', '#F9D1FF', '#FFFFFF'],
      ['Moss',      '#133A2A', '#FFB7C5', '#7FD18B', '#FFFFFF', '#F6F1E7'],
      ['Tomato',    '#FF1400', '#FFF1E0', '#0B0B0B', '#FF1400', '#000000'],
      ['Butter',    '#FFE9A8', '#E4002B', '#0F5132', '#FFC2C2', '#1A1A1A'],
      ['Blush',     '#FAD4D8', '#C8102E', '#274690', '#FFE3E6', '#1A1A1A'],
      ['Mono',      '#000000', '#F2F2F2', '#6E6E6E', '#000000', '#FFFFFF']
    ];

    const PRESETS_GARDEN = [
      { id: 'breathe', label: 'Breathe',        sub: 'Slow sway · 3s',       T: 3000 },
      { id: 'grow',    label: 'Grow & wither',  sub: 'Bloom, then back · 6s', T: 6000 },
      { id: 'typed',   label: 'Typed',          sub: 'Type, cut, repeat · 5s', T: 5000 },
      { id: 'wind',    label: 'Gust',           sub: 'Wind sweeps through · 4s', T: 4000 },
      { id: 'reach',   label: 'Reach',          sub: 'Stems follow a light · 6s', T: 6000 },
      { id: 'scatter', label: 'Scatter',        sub: 'Random bloom, fade · 6s', T: 6000 },
      { id: 'visit',   label: 'Visitor',        sub: 'Butterfly drops by · 7s', T: 7000 }
    ];

    // ---------- PALETTES & PRESETS: ELECTRICITY (FOCUSED ON YELLOW LIGHTNING SPARKS) ----------
    const PAL_ELECTRIC = [
      ['Electric Gold', '#000000', '#FFE600', '#FFAA00', '#FFFFFF', '#FFFFFF'],
      ['Sunfire Arc',   '#050505', '#FFD000', '#FF7700', '#FFFBE0', '#FFFFFF'],
      ['Neon Amber',    '#040301', '#FFB800', '#FF4400', '#FFE49E', '#FFFFFF'],
      ['Pure Lightning','#000000', '#FFFFFF', '#FFDD00', '#FFF275', '#FFFFFF'],
      ['Plasma Blue',   '#020814', '#00E5FF', '#0066FF', '#C7F8FF', '#FFFFFF']
    ];

    const PRESETS_ELECTRIC = [
      { id: 'breathe', label: 'Electric Crackle', sub: 'Active lightning arc · 3s', T: 3000 },
      { id: 'grow',    label: 'Thunder Strike',   sub: 'Burst & dissipate · 6s',    T: 6000 },
      { id: 'typed',   label: 'Conduction',       sub: 'Sparks along typing · 5s',  T: 5000 },
      { id: 'wind',    label: 'Voltage Surge',    sub: 'Lightning sweep · 4s',      T: 4000 },
      { id: 'reach',   label: 'Plasma Orb',       sub: 'Sparks seek orb · 6s',      T: 6000 },
      { id: 'scatter', label: 'Spark Storm',      sub: 'Chaotic rapid sparks · 6s', T: 6000 },
      { id: 'visit',   label: 'Ball Lightning',   sub: 'Spark wisp wanders · 7s',   T: 7000 }
    ];

    const FLOWERS = ['iris', 'fern', 'poppy', 'tulip', 'violet', 'clover', 'daisy', 'lilac', 'aster', 'peony'];
    const NODES_NAMES = ['spark', 'bolt', 'flash', 'arc', 'tesla', 'voltage', 'current', 'plasma'];
    const TINTS = ['#FF8A00', '#FFE600', '#FFB800', '#FFAA00', '#FFD23F', '#FFFFFF'];
    const SENT = String.fromCharCode(0x200b);
    const FONT_FAMILY = '"Playfair Display", Georgia, serif';

    // ---------- APP STATE ----------
    const state = {
      theme: 'electric', // Start in electric to give the user immediate feedback!
      mode: 'type',      // 'type' | 'poster'
      preset: 'breathe',
      palette: 0,
      text: 'bloom',
      seed: 7,
      status: '',
      busy: false,
      boil: true,
      recoil: 20,
      density: 1,
      showHint: true
    };

    // DOM Elements
    const appEl = document.getElementById('app');
    const mainCanvas = document.getElementById('mainCanvas');
    const posterCanvas = document.getElementById('posterCanvas');
    const hiddenInput = document.getElementById('hiddenInput');
    const peersContainer = document.getElementById('peersContainer');
    const typeBar = document.getElementById('typeBar');
    const posterView = document.getElementById('posterView');
    const btnThemeGarden = document.getElementById('btnThemeGarden');
    const btnThemeElectric = document.getElementById('btnThemeElectric');
    const btnModeType = document.getElementById('btnModeType');
    const btnModePoster = document.getElementById('btnModePoster');
    const paletteBar = document.getElementById('paletteBar');
    const posterPaletteGrid = document.getElementById('posterPaletteGrid');
    const presetGrid = document.getElementById('presetGrid');
    const posterTextInput = document.getElementById('posterTextInput');
    const btnReshuffle = document.getElementById('btnReshuffle');
    const posterInfoLabel = document.getElementById('posterInfoLabel');
    const btnExportVideo = document.getElementById('btnExportVideo');
    const btnExportFrames = document.getElementById('btnExportFrames');
    const exportStatus = document.getElementById('exportStatus');
    const btnSavePNG = document.getElementById('btnSavePNG');
    const btnSaveSVG = document.getElementById('btnSaveSVG');
    const gardenerCountEl = document.getElementById('gardenerCount');

    // Hint labels
    const hintType = document.getElementById('hintType');
    const hintTap = document.getElementById('hintTap');
    const hintCut = document.getElementById('hintCut');
    const hintWither = document.getElementById('hintWither');
    const hintWitherC = document.getElementById('hintWitherC');
    const hintClear = document.getElementById('hintClear');
    const hintClearC = document.getElementById('hintClearC');

    const g = mainCanvas.getContext('2d');
    const pg = posterCanvas.getContext('2d');

    // Engine variables
    let letters = [];
    let uid = 1;
    let cache = {};
    let Sd = 0, St = 0;
    let cx = 0, cy = 0, ctx_ = 0, cty = 0;
    let wrapped = false;
    let t0 = performance.now();
    let lastKey = 0;
    let rand = Math.random;
    let W = 0, H = 0, dpr = window.devicePixelRatio || 1;
    let fa = {};
    let mx = null, my = null;
    let flies = [];
    let perch = [];
    let _fl = null;
    let lt = null;
    let pt0 = 0;
    let P = null;
    let _light = [540, 540];
    let cc = null;
    let _now = null;
    let composing = false;
    let iv = SENT;
    let _kd = false;
    let touch = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
    let ptype = 'mouse';
    let peers = new Map();
    let gifts = [];
    let lastTap = null;
    let lastPlant = 0;
    let net = null;
    let others = 0;
    let lastSend = 0;
    let sentX = null, sentY = null;
    let roster = {};

    const pickRandom = a => a[Math.floor(Math.random() * a.length)];
    const me = { id: Math.random().toString(36).slice(2, 10), n: pickRandom(state.theme === 'electric' ? NODES_NAMES : FLOWERS), c: pickRandom(TINTS) };

    const vmime = typeof MediaRecorder !== 'undefined' ?
      ['video/mp4;codecs=avc1.42E01E', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m)) : null;

    const getPalettesList = () => state.theme === 'electric' ? PAL_ELECTRIC : PAL_GARDEN;
    const getPresetsList = () => state.theme === 'electric' ? PRESETS_ELECTRIC : PRESETS_GARDEN;

    const getPal = () => {
      const list = getPalettesList();
      const p = list[state.palette % list.length] || list[0];
      return {
        name: p[0],
        bg: p[1],
        flower: p[2],
        stem: p[3],
        line: p[4],
        text: p[5],
        C: { red: p[2], blue: p[3], line: p[4], text: p[5], vein: p[1] }
      };
    };

    // ---------- MATH & CURVE UTILITIES ----------
    const h = n => { const x = Math.sin(n) * 43758.5453; return x - Math.floor(x); };
    const spr = (t, k = 7, w = 16) => { if (t <= 0) return 0; return 1 - Math.exp(-t * k) * Math.cos(t * w); };
    const eo = t => { if (t <= 0) return 0; if (t >= 1) return 1; return 1 - Math.pow(1 - t, 3); };
    const rng = seed => {
      let s = seed | 0;
      return () => {
        s = (s + 0x6D2B79F5) | 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    };
    const bez = (a, b, c, d, n) => {
      const pts = [];
      for (let i = 0; i <= n; i++) {
        const t = i / n, u = 1 - t;
        pts.push([
          u*u*u*a[0] + 3*u*u*t*b[0] + 3*u*t*t*c[0] + t*t*t*d[0],
          u*u*u*a[1] + 3*u*u*t*b[1] + 3*u*t*t*c[1] + t*t*t*d[1]
        ]);
      }
      return pts;
    };
    const at = (polyline, u) => {
      const n = polyline.length;
      const i = Math.min(n - 2, Math.max(1, Math.round(u * (n - 1))));
      return [polyline[i], Math.atan2(polyline[i+1][1] - polyline[i-1][1], polyline[i+1][0] - polyline[i-1][0])];
    };
    const jit = (id, f, amp) => {
      if (!amp) return [0, 0, 0];
      return [
        (h(id * 1.37 + f * 7.13) * 2 - 1) * amp,
        (h(id * 2.71 + f * 3.11) * 2 - 1) * amp,
        (h(id * 5.3 + f * 1.7) * 2 - 1) * 0.035
      ];
    };

    const path = (ctx, p, closed) => {
      const n = p.length; if (n < 2) return;
      const m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      if (closed) {
        const s = m(p[n - 1], p[0]);
        ctx.moveTo(s[0], s[1]);
        for (let i = 0; i < n; i++) {
          const q = m(p[i], p[(i + 1) % n]);
          ctx.quadraticCurveTo(p[i][0], p[i][1], q[0], q[1]);
        }
        ctx.closePath();
      } else {
        ctx.moveTo(p[0][0], p[0][1]);
        for (let i = 1; i < n - 1; i++) {
          const q = m(p[i], p[i + 1]);
          ctx.quadraticCurveTo(p[i][0], p[i][1], q[0], q[1]);
        }
        ctx.lineTo(p[n - 1][0], p[n - 1][1]);
      }
    };

    const backend = ctx => ({
      fill: (p, col) => { ctx.beginPath(); path(ctx, p, true); ctx.fillStyle = col; ctx.fill(); },
      stroke: (p, col, width) => {
        ctx.beginPath();
        path(ctx, p, false);
        ctx.strokeStyle = col;
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
      },
      rect: (x, y, w, h_val, col) => { ctx.fillStyle = col; ctx.fillRect(x, y, w, h_val); },
      text: (ch, x, y, S, col) => {
        ctx.font = `700 ${S}px ${FONT_FAMILY}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        if (state.theme === 'electric') {
          ctx.shadowColor = '#FFB800';
          ctx.shadowBlur = 12;
        }
        ctx.fillStyle = col;
        ctx.fillText(ch, x, y);
        if (state.theme === 'electric') ctx.shadowBlur = 0;
      }
    });

    // ---------- REALISTIC FRACTAL LIGHTNING GENERATOR ----------
    // Generates genuine jagged lightning bolts like the reference picture
    const createLightningBolt = (r, p0, p1, displace = 25, roughness = 0.55, branches = 2) => {
      const dx = p1[0] - p0[0], dy = p1[1] - p0[1];
      const dist = Math.hypot(dx, dy);
      if (dist < 4) return { main: [p0, p1], forks: [] };

      // Midpoint displacement recursive iteration
      const segments = [[p0, p1]];
      const maxIters = 4;
      let curDisp = displace;

      for (let it = 0; it < maxIters; it++) {
        const nextSegs = [];
        for (const [a, b] of segments) {
          const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
          const nx = -(b[1] - a[1]), ny = (b[0] - a[0]);
          const segDist = Math.hypot(nx, ny) || 1;
          const offset = (r() - 0.5) * curDisp;
          const mid = [mx + (nx / segDist) * offset, my + (ny / segDist) * offset];
          nextSegs.push([a, mid], [mid, b]);
        }
        segments.splice(0, segments.length, ...nextSegs);
        curDisp *= roughness;
      }

      const mainPath = [segments[0][0]];
      for (const s of segments) mainPath.push(s[1]);

      // Sub-branches splitting off
      const forks = [];
      if (branches > 0 && mainPath.length > 6) {
        const numForks = 1 + Math.floor(r() * branches);
        for (let f = 0; f < numForks; f++) {
          const forkIdx = Math.floor(0.25 * mainPath.length + r() * 0.55 * mainPath.length);
          const forkOrigin = mainPath[forkIdx];
          const baseAngle = Math.atan2(dy, dx) + (r() < 0.5 ? 1 : -1) * (0.5 + r() * 0.5);
          const forkLen = dist * (0.35 + r() * 0.4);
          const forkEnd = [
            forkOrigin[0] + Math.cos(baseAngle) * forkLen,
            forkOrigin[1] + Math.sin(baseAngle) * forkLen
          ];
          const subBolt = createLightningBolt(r, forkOrigin, forkEnd, displace * 0.5, roughness, 0);
          forks.push(subBolt.main);
        }
      }

      return { main: mainPath, forks };
    };

    // Draw single electric lightning bolt with amber glow + yellow body + white hot core
    const renderLightningBolt = (ctx, pts, growFr, alpha, amberColor, yellowColor, S) => {
      if (pts.length < 2 || growFr <= 0 || alpha <= 0) return;
      const count = Math.max(2, Math.floor(pts.length * growFr));
      const sub = pts.slice(0, count);

      ctx.save();
      ctx.globalAlpha = alpha;

      const drawStroke = (col, width, blur) => {
        ctx.beginPath();
        ctx.moveTo(sub[0][0], sub[0][1]);
        for (let i = 1; i < sub.length; i++) ctx.lineTo(sub[i][0], sub[i][1]);
        ctx.strokeStyle = col;
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'miter';
        if (blur > 0) {
          ctx.shadowColor = col;
          ctx.shadowBlur = blur;
        } else {
          ctx.shadowBlur = 0;
        }
        ctx.stroke();
      };

      // 1. Broad outer amber aura (soft glow)
      drawStroke(amberColor, S * 0.045, 18);
      // 2. High-intensity electric yellow beam
      drawStroke(yellowColor, S * 0.022, 8);
      // 3. Crisp white-hot filament center
      drawStroke('#FFFFFF', Math.max(1, S * 0.009), 0);

      ctx.restore();
    };

    // Helper to spawn an electric spark for a letter
    const spawnSparkForLetter = (l, now, S, options = {}) => {
      if (!l.sparks) l.sparks = [];
      const r = rng(Math.floor(Math.random() * 1e7));
      const w = mw(l.ch);
      const startX = options.x != null ? options.x : (r() - 0.5) * w * 0.7;
      const startY = options.y != null ? options.y : -0.1 - r() * 0.55;

      const dir = options.dir != null ? options.dir : -Math.PI / 2 + (r() - 0.5) * 1.8;
      const len = options.len != null ? options.len : (0.45 + r() * 0.65) * S;

      const p0 = [l.x + startX * S, l.y + startY * S];
      const p1 = [p0[0] + Math.cos(dir) * len, p0[1] + Math.sin(dir) * len];

      const bolt = createLightningBolt(r, p0, p1, len * 0.35, 0.58, 2);
      const lifespan = 200 + Math.floor(r() * 180); // 200ms - 380ms

      l.sparks.push({
        id: uid++,
        main: bolt.main,
        forks: bolt.forks,
        t0: now,
        dur: lifespan
      });
    };

    // ---------- ORGANIC GARDEN GENERATOR (GARDEN THEME ONLY) ----------
    const vine = (base, dir, len, amp, waves, ph, bend, n = 40) => {
      const P_pts = [[base[0], base[1]]], step = len / n;
      let x = base[0], y = base[1];
      for (let i = 1; i <= n; i++) {
        const u = i / n, a = dir + bend * u + amp * Math.sin(u * Math.PI * waves + ph) * Math.min(1, u * 3);
        x += Math.cos(a) * step;
        y += Math.sin(a) * step;
        P_pts.push([x, y]);
      }
      return P_pts;
    };

    const curl = (P_pts, sign, rad) => {
      const n = P_pts.length, e = P_pts[n - 1], a = Math.atan2(e[1] - P_pts[n - 2][1], e[0] - P_pts[n - 2][0]);
      const c = [e[0] - Math.sin(a) * sign * rad, e[1] + Math.cos(a) * sign * rad];
      const a0 = Math.atan2(e[1] - c[1], e[0] - c[0]);
      for (let i = 1; i <= 14; i++) {
        const u = i / 14, t = a0 + sign * u * Math.PI * 1.6, rr = rad * (1 - 0.5 * u);
        P_pts.push([c[0] + Math.cos(t) * rr, c[1] + Math.sin(t) * rr]);
      }
      return P_pts;
    };

    const weave = (r, startLayer) => {
      const cuts = []; const nc = 1 + Math.floor(r() * 3);
      for (let i = 0; i < nc; i++) cuts.push(0.15 + r() * 0.7);
      cuts.sort((a, b) => a - b);
      const segs = []; let u0 = 0, layer = startLayer;
      for (const c of cuts) {
        if (c <= u0) continue;
        segs.push({ u0, u1: c, layer });
        if (r() < 0.3) { const gap = 0.02 + r() * 0.03; u0 = Math.min(0.98, c + gap); } else u0 = c;
        layer = 1 - layer;
      }
      segs.push({ u0, u1: 1, layer });
      return segs;
    };

    const layerAt = (segs, u) => {
      for (const s of segs) if (u >= s.u0 && u <= s.u1) return s.layer;
      return segs[segs.length - 1].layer;
    };

    // ---------- LAYOUT & TYPOGRAPHY ----------
    const mw = ch => {
      if (cache[ch] != null) return cache[ch];
      g.font = `700 100px ${FONT_FAMILY}`;
      let w = g.measureText(ch).width / 100;
      if (ch === ' ') w *= 1.4;
      return (cache[ch] = w);
    };

    const layoutCore = (A, W_val, H_val, prevWrapped) => {
      const maxW = W_val * 0.8, S0 = H_val * 0.28, LH = 2.1;
      const ws = A.map(l => mw(l.ch));
      const words = []; let cur = null;
      A.forEach((l, i) => {
        if (l.ch === ' ') {
          if (cur) { words.push(cur); cur = null; }
          words.push({ sp: true, idx: [i] });
        } else {
          if (!cur) cur = { idx: [] };
          cur.idx.push(i);
        }
      });
      if (cur) words.push(cur);

      const lineW = (li, S) => {
        let e = li.length;
        while (e > 0 && A[li[e - 1]].ch === ' ') e--;
        let w = 0;
        for (let k = 0; k < e; k++) w += ws[li[k]];
        return w * S;
      };

      const wrap = S => {
        const lines = [[]]; let lw = 0;
        for (const w of words) {
          const ww = w.idx.reduce((s, i) => s + ws[i], 0) * S;
          if (!w.sp && lw > 0 && lw + ww > maxW) { lines.push([]); lw = 0; }
          lines[lines.length - 1].push(...w.idx);
          lw += ww;
        }
        return lines;
      };

      let lines = [A.map((_, i) => i)];
      const unit = lineW(lines[0], 1);
      let S = unit > 0 ? Math.min(S0, maxW / unit) : S0;
      const multi = words.filter(w => !w.sp).length > 1;
      let isWrapped = multi && (S < H_val * 0.1 || (prevWrapped && S < H_val * 0.14));
      if (isWrapped) {
        let lo = H_val * 0.03, hi = H_val * 0.15;
        for (let k = 0; k < 22; k++) {
          const mid = (lo + hi) / 2, ls = wrap(mid);
          const ok = ls.every(li => lineW(li, mid) <= maxW) && ls.length * LH * mid <= H_val * 0.82;
          if (ok) lo = mid; else hi = mid;
        }
        S = lo; lines = wrap(S);
        if (lines.length < 2) isWrapped = false;
      }
      const n = lines.length, lh = LH * S;
      lines.forEach((li, k) => {
        let x = W_val / 2 - lineW(li, S) / 2;
        const y = H_val / 2 + (k - (n - 1) / 2) * lh + 0.33 * S;
        li.forEach(i => {
          const l = A[i], w = ws[i] * S;
          l.tx = x + w / 2;
          l.ty = y;
          l.tw = w;
          l.line = k;
          x += w;
        });
      });
      return { S, wrapped: isWrapped, n };
    };

    const layout = snap => {
      if (!W) return;
      const A = letters.filter(l => !l.dead);
      const res = layoutCore(A, W, H, wrapped);
      wrapped = res.wrapped;
      A.forEach(l => { if (l.x == null) { l.x = l.tx; l.y = l.ty; } });
      const S = res.S, last = A[A.length - 1];
      St = S;
      ctx_ = last ? last.tx + last.tw / 2 + 0.07 * S : W / 2;
      cty = last ? last.ty - 0.33 * S : H / 2;
      if (snap || !Sd) {
        Sd = S; cx = ctx_; cy = cty;
        A.forEach(l => { l.x = l.tx; l.y = l.ty; });
      }
    };

    const resize = () => {
      const r = mainCanvas.getBoundingClientRect();
      dpr = window.devicePixelRatio || 1;
      if (!r.width) return;
      W = r.width; H = r.height;
      mainCanvas.width = Math.round(r.width * dpr);
      mainCanvas.height = Math.round(r.height * dpr);
      layout(true);
    };

    // ---------- PROCEDURAL GROWTH SYSTEM (GARDEN) ----------
    const wordParams = ws => {
      const r = rng(ws * 7 + 13), dens = state.density ?? 1;
      return {
        roseP: 0.3 + r() * 0.3,
        leafy: (0.6 + r() * 0.8) * dens,
        dens,
        lean: (r() - 0.5) * 0.6,
        big: 0.85 + r() * 0.45,
        curvy: 0.8 + r() * 0.6,
        bridgeP: Math.min(0.95, (0.45 + r() * 0.35) * dens),
        w: 0.5
      };
    };

    const grow = (r, E, nid, p, o) => {
      const tip = o.tip || (r() < p.roseP ? 'rose' : r() < 0.45 ? 'fan' : r() < 0.6 ? 'leaf' : 'curl');
      let P_pts = o.pts || vine(o.base, o.dir, o.len, (0.35 + r() * 0.45) * p.curvy, 1 + r() * 1.6, r() * 6.28, (r() - 0.5) * 1.2, 40);
      if (tip === 'curl') P_pts = curl(P_pts, r() < 0.5 ? -1 : 1, 0.05 + r() * 0.05);
      const segs = weave(r, o.layer0 != null ? o.layer0 : (r() < 0.5 ? 0 : 1));
      const dur = Math.max(320, (o.len || 0.8) * 620);

      const thorns = []; const nt = Math.floor(r() * 2.5);
      for (let i = 0; i < nt; i++) thorns.push({ u: 0.15 + r() * 0.65, s: r() < 0.5 ? -1 : 1 });
      E.push({ t: 'stem', id: nid(), pts: P_pts, segs, d0: o.d0, dur, w: o.depth ? 0.82 : 1, thorns });

      const nl = Math.floor(r() * 2.8 * p.leafy);
      let sd = r() < 0.5 ? -1 : 1;
      for (let i = 0; i < nl; i++) {
        const u = 0.25 + r() * 0.6, [q, a] = at(P_pts, u); sd = -sd;
        E.push({
          t: 'leaf',
          id: nid(),
          x: q[0],
          y: q[1],
          a: a + sd * (0.55 + r() * 0.5),
          L: (0.14 + r() * 0.2) * (o.depth ? 0.8 : 1),
          bend: (r() - 0.5) * 1.2,
          layer: layerAt(segs, u),
          d0: o.d0 + dur * u
        });
      }

      const [tp, ta] = at(P_pts, 1), td = o.d0 + dur * 0.8, tl = layerAt(segs, 1);
      if (tip === 'rose') {
        const R = (0.13 + r() * 0.15) * p.big * (o.depth ? 0.75 : 1);
        const over = tp[1] > -0.78 && tp[1] < 0.05 && Math.abs(tp[0]) < p.w * 0.5;
        const layer = over ? (r() < 0.22 ? 1 : 0) : (r() < 0.6 ? 1 : tl);
        E.push({ t: 'rose', id: nid(), x: tp[0], y: tp[1], R, rot: (r() - 0.5) * 1.0, ph1: r() * 6.28, ph2: r() * 6.28, turns: 1.8 + r() * 1, layer, d0: td });
        if (r() < 0.2) {
          const oo = ta + (r() < 0.5 ? 1 : -1) * 1.3;
          E.push({ t: 'rose', id: nid(), x: tp[0] + Math.cos(oo) * R * 1.4, y: tp[1] + Math.sin(oo) * R * 1.4, R: R * (0.6 + r() * 0.3), rot: (r() - 0.5) * 1.2, ph1: r() * 6.28, ph2: r() * 6.28, turns: 1.8 + r(), layer, d0: td + 120 });
        }
      } else if (tip === 'fan') {
        const spread = 0.6 + r() * 0.3;
        for (let j = 0; j < 2; j++) {
          E.push({ t: 'leaf', id: nid(), x: tp[0], y: tp[1], a: ta + (j - 0.5) * spread, L: 0.2 + r() * 0.2, bend: (j - 0.5) * 0.8, layer: tl, d0: td + j * 60 });
        }
      } else if (tip === 'leaf') {
        E.push({ t: 'leaf', id: nid(), x: tp[0], y: tp[1], a: ta + (r() - 0.5) * 0.3, L: 0.16 + r() * 0.16, bend: (r() - 0.5), layer: tl, d0: td });
      }

      if (!o.depth && r() < 0.3) {
        const u = 0.35 + r() * 0.35, [q, a] = at(P_pts, u);
        grow(r, E, nid, p, {
          base: q,
          dir: a + (r() < 0.5 ? -1 : 1) * (0.7 + r() * 0.4),
          len: (o.len || 0.8) * (0.35 + r() * 0.2),
          d0: o.d0 + dur * u,
          depth: 1,
          layer0: layerAt(segs, u)
        });
      }
      return P_pts;
    };

    const gen = l => {
      if (state.theme === 'electric') {
        // Electricity: Initialize sparks for letter!
        l.els = [];
        l.endEls = null;
        l.tend = null;
        l.sparks = [];
        const now = performance.now();
        const numInitialSparks = 3 + Math.floor(Math.random() * 3);
        for (let i = 0; i < numInitialSparks; i++) {
          spawnSparkForLetter(l, now + i * 25, Sd || 100);
        }
        l.nextSparkT = now + 80 + Math.random() * 120;
        return;
      }

      // Garden Mode
      const r = rng((l.ws ^ Math.imul(l.wi + 1, 2654435761)) + Math.floor(rand() * 1e6));
      const p = wordParams(l.ws), E = []; let k0 = 0; const nid = () => l.id * 100 + (k0++);
      const w = mw(l.ch), inX = () => (r() - 0.5) * w * 0.7; p.w = w;
      const nUp = 1 + (r() < 0.45 * p.dens ? 1 : 0);
      for (let i = 0; i < nUp; i++) {
        grow(r, E, nid, p, { base: [inX(), -r() * 0.3], dir: -Math.PI / 2 + p.lean * 0.5 + (r() - 0.5) * 0.7, len: 0.6 + r() * 0.5, d0: 40 + i * 130, tip: l.wi === 0 && i === 0 ? 'rose' : null });
      }
      if (r() < 0.4 * p.dens) grow(r, E, nid, p, { base: [inX(), -0.1 - r() * 0.35], dir: Math.PI / 2 + (r() - 0.5) * 0.8, len: 0.35 + r() * 0.35, d0: 160 });
      if (l.prev && r() < p.bridgeP) {
        const px = -(mw(l.prev.ch) + w) / 2;
        const a = [inX(), -0.05 - r() * 0.55], b = [px + (r() - 0.5) * 0.25, -0.05 - r() * 0.55];
        const bulge = (r() < 0.55 ? -1 : 1) * (0.4 + r() * 0.4), dx = b[0] - a[0];
        let P_bez = bez(a, [a[0] + dx * 0.15, a[1] + bulge], [b[0] - dx * 0.15, b[1] + bulge * 0.9], b, 40);
        if (r() < 0.45) P_bez = P_bez.slice(0, Math.floor(P_bez.length * (0.7 + r() * 0.2)));
        grow(r, E, nid, p, { pts: P_bez, len: Math.abs(dx) + Math.abs(bulge), d0: 90, tip: r() < 0.5 ? 'curl' : r() < 0.5 ? 'leaf' : 'rose' });
      }
      if (l.wi === 0) grow(r, E, nid, p, { base: [-w * 0.3, -0.15 - r() * 0.4], dir: Math.PI + (r() - 0.5) * 1.2, len: 0.45 + r() * 0.3, d0: 120, tip: 'curl' });
      l.els = E;
      l.endEls = null;
      const T_end = [], tr = rng(l.id * 977 + Math.floor(rand() * 1e6));
      grow(tr, T_end, () => l.id * 100 + 90 + T_end.length, p, { base: [w * 0.25, -0.1 - tr() * 0.45], dir: (tr() - 0.5) * 1.4, len: 0.45 + tr() * 0.25, d0: 0, tip: 'curl', depth: 1 });
      l.tend = T_end.filter(e => e.t === 'stem').slice(0, 1);
    };

    const genEnd = (l, rel) => {
      if (state.theme === 'electric') {
        // Electric burst on space!
        const now = performance.now();
        for (let i = 0; i < 6; i++) {
          spawnSparkForLetter(l, now + i * 20, Sd || 100, { len: (0.7 + Math.random() * 0.7) * (Sd || 100) });
        }
        return;
      }

      // Garden End Bloom
      const r = rng(l.ws + l.wi * 31 + Math.floor(rand() * 1e6)), p = wordParams(l.ws), E = [];
      let k0 = 50; const nid = () => l.id * 100 + (k0++);
      const w = mw(l.ch), n = 1 + Math.floor(r() * 2.5); p.w = w;
      for (let i = 0; i < n; i++) {
        const dir = -Math.PI / 2 + 0.6 + (i - (n - 1) / 2) * 0.9 + (r() - 0.5) * 0.4;
        grow(r, E, nid, p, { base: [(r() - 0.2) * w * 0.6, -r() * 0.5], dir, len: 0.4 + r() * 0.45, d0: rel + 40 + i * 90, depth: 1, tip: i === 0 || r() < 0.5 ? 'rose' : 'fan' });
      }
      l.endEls = E;
    };

    // ---------- GARDEN DRAWING PRIMITIVES ----------
    const strokeRange = (B, P_pts, a, b, col, width) => {
      const n = P_pts.length - 1, ia = a * n, ib = b * n;
      const lerp = t => {
        const i = Math.min(n - 1, Math.floor(t)), f = t - i;
        return [P_pts[i][0] + (P_pts[i+1][0] - P_pts[i][0]) * f, P_pts[i][1] + (P_pts[i+1][1] - P_pts[i][1]) * f];
      };
      const pts = [lerp(ia)];
      for (let i = Math.floor(ia) + 1; i < ib; i++) pts.push(P_pts[i]);
      pts.push(lerp(ib));
      if (pts.length >= 2) B.stroke(pts, col, width);
    };

    const thorn = (B, P_pts, u, s, S) => {
      const [p, a] = at(P_pts, u);
      const d = a + s * 2.3, L = S * 0.045;
      B.stroke([p, [p[0] + Math.cos(d) * L, p[1] + Math.sin(d) * L]], cc.blue, S * 0.022);
    };

    const leaf = (B, bx, by, a, L, bend) => {
      if (L < 0.5) return;
      const ca = Math.cos(a), sa = Math.sin(a), px = -sa, py = ca;
      const ax_fn = u => { const b = Math.sin(Math.PI * u) * bend * 0.15 * L; return [bx + ca * u * L + px * b, by + sa * u * L + py * b]; };
      const hw = u => L * 0.18 * Math.sin(Math.PI * Math.pow(u, 0.8));
      const N = 12, s1 = [], s2 = [];
      for (let i = 0; i <= N; i++) {
        const u = i / N, c = ax_fn(u), w = hw(u);
        s1.push([c[0] + px * w, c[1] + py * w]);
        s2.push([c[0] - px * w, c[1] - py * w]);
      }
      const tip = ax_fn(1), base = ax_fn(0);
      B.fill([base, ...s1.slice(1, N), tip, tip, ...s2.slice(1, N).reverse(), base], cc.blue);
      if (L > 6) {
        const v = [];
        for (let i = 0; i <= 8; i++) v.push(ax_fn(0.08 + 0.72 * i / 8));
        B.stroke(v, cc.vein, Math.max(0.8, L * 0.03));
      }
    };

    const rose = (B, cx_pos, cy_pos, R, rot, e, a, tl) => {
      const cr = Math.cos(rot), sr = Math.sin(rot);
      const tm = tl ? Math.hypot(tl[0], tl[1]) : 0, ux = tm ? tl[0] / tm : 0, uy = tm ? tl[1] / tm : 0, sq = -0.28 * tm;
      const T = (x, y, z = 0) => {
        let dx = x * cr - y * sr, dy = x * sr + y * cr;
        if (tm) {
          const k = (dx * ux + dy * uy) * sq;
          dx += k * ux + tl[0] * R * z;
          dy += k * uy + tl[1] * R * z;
        }
        return [cx_pos + dx, cy_pos + dy];
      };

      const P_petals = [
        [0, -0.36, 0.56, 0.54, 0, 0, 0],
        [-0.5, -0.06, 0.6, 0.6, -0.35, 0, 0],
        [0.52, -0.06, 0.6, 0.6, 0.35, 0, 0],
        [-0.42, 0.3, 0.62, 0.48, 0.2, 0.12, 1],
        [0.47, 0.3, 0.62, 0.48, -0.2, 0.12, 1],
        [0.05, 0.42, 0.56, 0.38, 0, 0.14, 0]
      ];
      const ax0 = 0, ay0 = 0.5, lw = Math.max(0.8, R * 0.045), st = 85;

      P_petals.forEach((q, i) => {
        const s = spr((a - i * st) / 1000, 8, 14); if (s <= 0.001) return;
        const open = (1 - Math.min(1, s)) * (q[0] < 0 ? 0.5 : -0.5), ang = q[4] + open, ca = Math.cos(ang), sa = Math.sin(ang);
        const pt = th => {
          const rr = 1 + 0.08 * Math.sin(3 * th + e.ph1 + i) + 0.04 * Math.sin(5 * th + e.ph2);
          const lx = Math.cos(th) * q[2] * rr, ly = Math.sin(th) * q[3] * rr;
          const px = q[0] + lx * ca - ly * sa, py = q[1] + lx * sa + ly * ca;
          return T((ax0 + (px - ax0) * s) * R, (ay0 + (py - ay0) * s) * R, q[5]);
        };
        const pts = []; for (let k = 0; k < 26; k++) pts.push(pt(k / 26 * Math.PI * 2));
        B.fill(pts, cc.red);
        if (q[6] && R >= 12 && s > 0.4) {
          const arc = []; for (let k = 0; k <= 14; k++) arc.push(pt(Math.PI * (1.18 + 0.64 * k / 14)));
          strokeRange(B, arc, 0, Math.min(1, (s - 0.4) / 0.5), cc.line, lw * 0.8);
        }
      });

      const fr = eo((a - P_petals.length * st - 80) / 520);
      if (fr > 0 && R > 3) {
        const sp = [], scl = [];
        const turns = R < 20 ? Math.min(e.turns, 1.3) : R < 32 ? e.turns * 0.8 : e.turns;
        for (let i = 0; i <= 70; i++) {
          const u = i / 70, th = e.ph1 + u * turns * Math.PI * 2, rr = R * (0.08 + 0.57 * u);
          sp.push(T(Math.cos(th) * rr * 1.05, Math.sin(th) * rr * 0.72 - 0.12 * R, 0.34 - 0.24 * u));
        }
        strokeRange(B, sp, 0, fr, cc.line, lw);
        if (R >= 14) {
          for (let i = 0; i <= 36; i++) {
            const u = i / 36;
            scl.push(T((-0.72 + 1.5 * u) * R, 0.36 * R + 0.16 * R * Math.abs(Math.sin(u * Math.PI * 3)), 0.18));
          }
          strokeRange(B, scl, 0, fr, cc.line, lw);
        }
      }
    };

    // ---------- VISITOR ENTITIES ----------
    const spawnFly = (clickX, clickY) => {
      if (flies.length >= 6) {
        const o = flies.find(f => f.st !== 'leave');
        if (o) flyOff(o);
      }
      const taken = new Set(flies.filter(f => f.st !== 'leave').map(f => f.pid));
      let best = null, bd = 1e9;
      for (const p of perch) {
        if (taken.has(p.id)) continue;
        const d = Math.hypot(p.x - clickX, p.y - clickY);
        if (d < bd) { bd = d; best = p; }
      }
      const left = clickX < W / 2, sz = Math.max(9, Sd * 0.09);
      flies.push({
        x: left ? -40 : W + 40,
        y: clickY + (Math.random() - 0.5) * H * 0.4,
        vx: 0, vy: 0,
        st: best ? 'fly' : 'wander',
        pid: best ? best.id : null,
        hx: clickX, hy: clickY,
        t0: performance.now(),
        ph: Math.random() * 6,
        sz,
        seed: Math.random() * 100,
        ang: 0
      });
    };

    const flyOff = f => {
      f.st = 'leave'; f.pid = null;
      f.ex = f.x < W / 2 ? -80 : W + 80;
      f.ey = f.y - H * 0.3;
    };

    const butterfly = (B, x, y, s, ang, o, colors) => {
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const T = (px, py) => [x + (px * ca - py * sa) * s, y + (px * sa + py * ca) * s];
      const wing = (cx_pos, cy_pos, rx, ry, a, side) => {
        const pts = [], c = Math.cos(a), sn = Math.sin(a);
        for (let k = 0; k < 22; k++) {
          const th = k / 22 * Math.PI * 2, r = 1 + 0.08 * Math.sin(th * 3);
          const lx = Math.cos(th) * rx * r, ly = Math.sin(th) * ry * r;
          pts.push(T(side * (cx_pos + lx * c - ly * sn) * (0.12 + 0.88 * o), cy_pos + lx * sn + ly * c));
        }
        return pts;
      };
      for (const sd of [-1, 1]) {
        B.fill(wing(0.46, 0.28, 0.36, 0.3, 0.5 * sd * sd, sd), colors.text);
        B.fill(wing(0.55, -0.32, 0.55, 0.36, -0.55, sd), colors.text);
        if (o > 0.35) B.fill(wing(0.66, -0.4, 0.13, 0.11, 0, sd), colors.red);
      }
      const body = [];
      for (let k = 0; k < 18; k++) {
        const th = k / 18 * Math.PI * 2;
        body.push(T(Math.cos(th) * 0.08, Math.sin(th) * 0.48));
      }
      B.fill(body, colors.blue);
      const lw = Math.max(0.8, s * 0.05);
      B.stroke([T(0, -0.42), T(-0.14, -0.72), T(-0.24, -0.86)], colors.blue, lw);
      B.stroke([T(0, -0.42), T(0.14, -0.72), T(0.24, -0.86)], colors.blue, lw);
    };

    // Yellow Ball Lightning spark wisp (Electricity visitor)
    const electricSparkWisp = (ctx, x, y, s, now) => {
      ctx.save();
      // Orbiting lightning arcs
      const r_wisp = s * 0.8;
      const pts = [];
      for (let i = 0; i <= 8; i++) {
        const th = i / 8 * Math.PI * 2;
        const rad = r_wisp * (0.7 + 0.3 * Math.sin(now * 0.02 + i * 3));
        pts.push([x + Math.cos(th) * rad, y + Math.sin(th) * rad]);
      }
      renderLightningBolt(ctx, pts, 1, 0.9, '#FF9900', '#FFE600', s * 1.5);

      // Bright nucleus
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(x, y, s * 0.25, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    };

    const drawFlies = (B, now, colors) => {
      const dt = Math.min(48, now - (_fl || now)); _fl = now;
      const byId = {}; for (const p of perch) byId[p.id] = p;
      flies = flies.filter(f => {
        const t = (now - f.t0) / 1000;
        let tx_pos, ty_pos;
        if (f.st === 'sit' || f.st === 'fly') {
          const p = byId[f.pid];
          if (!p) { flyOff(f); }
          else { tx_pos = p.x + p.R * 0.05; ty_pos = p.y - p.R * 0.55; }
        }
        if (f.st === 'wander') {
          tx_pos = f.hx + Math.sin(t * 1.3 + f.seed) * 70;
          ty_pos = f.hy + Math.sin(t * 2.1 + f.seed) * 40;
          if (t > 3.5) flyOff(f);
        }
        if (f.st === 'leave') { tx_pos = f.ex; ty_pos = f.ey; }

        if (f.st === 'sit') {
          f.x += (tx_pos - f.x) * 0.35;
          f.y += (ty_pos - f.y) * 0.35;
          f.ang *= 0.85;
          f.ph += dt * 0.004;
          const burst = Math.sin(now / 1000 * 0.9 + f.seed) > 0.75;
          f.open = burst ? 0.2 + 0.8 * Math.abs(Math.cos(now / 1000 * 9 + f.seed)) : 0.25 + 0.15 * Math.sin(f.ph);
        } else {
          const dx = tx_pos - f.x, dy = ty_pos - f.y, d = Math.hypot(dx, dy) || 1;
          const sp = f.st === 'leave' ? 0.42 : Math.min(0.34, 0.06 + d * 0.0016);
          const flut = Math.sin(t * 7 + f.seed) * 0.12, wob = Math.cos(t * 4.3 + f.seed) * 0.1;
          const ax_val = (dx / d * sp + wob) - f.vx, ay_val = (dy / d * sp + flut) - f.vy;
          f.vx += ax_val * 0.06 * dt / 16; f.vy += ay_val * 0.06 * dt / 16;
          f.x += f.vx * dt; f.y += f.vy * dt + Math.sin(t * 13 + f.seed) * 0.6;
          f.ang += (Math.max(-0.5, Math.min(0.5, f.vx * 1.4)) - f.ang) * 0.1;
          f.open = Math.abs(Math.cos(t * 17 + f.seed));
          if (f.st === 'fly' && d < 5) { f.st = 'sit'; f.ph = 0; }
          if (f.st === 'leave' && (f.x < -60 || f.x > W + 60 || f.y < -60)) return false;
        }

        if (state.theme === 'electric') {
          const currentCtx = state.mode === 'poster' ? pg : g;
          electricSparkWisp(currentCtx, f.x, f.y, f.sz, now);
        } else {
          butterfly(B, f.x, f.y, f.sz, f.ang, f.open, colors);
        }
        return true;
      });
    };

    // Yellow interactive lightning arc leaping to mouse cursor
    const drawInteractiveArc = (ctx, now, colors) => {
      if (state.theme !== 'electric' || mx == null) return;
      const act = letters.filter(l => !l.dead && l.ch !== ' ');
      if (!act.length) return;
      let closest = null, minDist = 1e9;
      for (const l of act) {
        const d = Math.hypot(l.x - mx, (l.y - Sd * 0.4) - my);
        if (d < minDist) { minDist = d; closest = l; }
      }
      if (closest && minDist < 340 && minDist > 10) {
        const r_arc = rng(Math.floor(now / 50));
        const bolt = createLightningBolt(r_arc, [closest.x, closest.y - Sd * 0.4], [mx, my], minDist * 0.22, 0.6, 1);
        renderLightningBolt(ctx, bolt.main, 1, 0.95, colors.stem, colors.flower, Sd);
        for (const fork of bolt.forks) {
          renderLightningBolt(ctx, fork, 1, 0.7, colors.stem, colors.flower, Sd * 0.7);
        }

        // Contact spark ring at cursor
        ctx.save();
        ctx.shadowColor = colors.flower;
        ctx.shadowBlur = 12;
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(mx, my, 4 + 2 * Math.sin(now * 0.05), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    };

    // ---------- POINTER TRACKING & FACING ----------
    const near = (x_pos, y_pos) => {
      let best = mx != null ? [mx, my] : null;
      let bd = best ? Math.hypot(best[0] - x_pos, best[1] - y_pos) : 1e9;
      if (peers && peers.size) {
        const now = performance.now();
        for (const p of peers.values()) {
          if (p.h || p.x == null || now - p.t > 8000) continue;
          const d = Math.hypot(p.x - x_pos, p.y - y_pos);
          if (d < bd) { bd = d; best = [p.x, p.y]; }
        }
      }
      return best;
    };

    const faceTurn = (element, x_pos, y_pos) => {
      let wx = 0, wy = 0;
      const A = near(x_pos, y_pos);
      if (A) {
        const dx = A[0] - x_pos, dy = A[1] - y_pos, d = Math.hypot(dx, dy), reach = 300;
        if (d < reach && d > 0.001) {
          const w = 1 - d / reach, s = w * w * (3 - 2 * w) * Math.min(1, d / 40);
          wx = dx / d * s; wy = dy / d * s;
        }
      }
      const c = fa[element.id] || [0, 0];
      c[0] += (wx - c[0]) * 0.09;
      c[1] += (wy - c[1]) * 0.09;
      fa[element.id] = c;
      return c;
    };

    // ---------- RENDERING (CANVAS + PARTICLES) ----------
    const wpt = (st, l, x, y) => {
      if (l.birth != null && _now != null) {
        const t = (_now - l.birth) * (st.speed || 1) / 1000;
        if (t > 0 && t < 2.5) {
          const hh = Math.max(0, (l.y - y) / st.S), dmp = Math.exp(-t * 3.2), dir = (l.id % 2 ? 1 : -1);
          x += st.S * 0.07 * hh * dmp * Math.sin(t * 11) * dir;
          y += st.S * 0.035 * hh * dmp * Math.sin(t * 11 + 1.2);
        }
      }
      if (st.face && l.lean) {
        const hh = Math.min(2.5, Math.max(0, (l.y - y) / st.S)), f = hh * hh * 0.5 + hh * 0.5;
        x += l.lean[0] * st.S * 0.1 * f;
        y += l.lean[1] * st.S * 0.05 * f;
      }
      return st.warp ? st.warp(x, y, l) : [x, y];
    };

    const drawStem = (B, e, l, age, kk, st, f, amp, layer, frO) => {
      const S = st.S, fr = frO != null ? frO : eo((age - e.d0) / e.dur) * kk;
      if (fr <= 0) return;
      const j = jit(e.id, f, amp);
      const P_pts = e.pts.map(p => wpt(st, l, l.x + p[0] * S + j[0], l.y + p[1] * S + j[1]));
      for (const sg of e.segs) {
        if (sg.layer !== layer) continue;
        const b = Math.min(sg.u1, fr); if (b <= sg.u0) continue;
        strokeRange(B, P_pts, sg.u0, b, st.C.blue, S * 0.022 * (e.w || 1));
      }
      for (const th of e.thorns) {
        if (fr > th.u && layerAt(e.segs, th.u) === layer) thorn(B, P_pts, th.u, th.s, S);
      }
    };

    const drawEl = (B, e, l, age, kk, st, f, amp) => {
      const S = st.S, j = jit(e.id, f, amp), wx_fn = (x, y) => wpt(st, l, l.x + x * S + j[0], l.y + y * S + j[1]);
      const rw = st.rotw ? st.rotw(e) : 0;
      if (e.t === 'leaf') {
        const sc = spr((age - e.d0) / 1000, 7, 15) * kk; if (sc <= 0) return;
        const p = wx_fn(e.x, e.y);
        leaf(B, p[0], p[1], e.a + j[2] + rw, e.L * S * sc, e.bend);
      } else if (e.t === 'rose') {
        const a = age - e.d0; if (a < 0 || kk <= 0.001) return;
        const p = wx_fn(e.x, e.y), tl = st.face ? faceTurn(e, p[0], p[1]) : null;
        if ((st.face || st.perchOn) && !l.dead && a > 700) {
          perch.push({ id: e.id, x: p[0], y: p[1], R: e.R * S * kk });
        }
        rose(B, p[0], p[1], e.R * S * kk, e.rot + j[2] + rw + (tl ? tl[0] * 0.22 : 0), e, a, tl);
      }
    };

    // Render Electric Lightning Sparks for a letter (GROWS RAPIDLY THEN DISSIPATES LIKE REAL SPARKS)
    const renderElectricSparksForLetter = (ctx, l, now, S, colors) => {
      if (!l.sparks) l.sparks = [];

      // Remove dead sparks that finished their lifespan
      l.sparks = l.sparks.filter(sp => (now - sp.t0) < sp.dur);

      // Continuous ambient spark crackling: spawn a new spark every ~80-160ms per alive letter
      if (!l.dead && now > (l.nextSparkT || 0)) {
        spawnSparkForLetter(l, now, S);
        l.nextSparkT = now + 90 + Math.random() * 160;
      }

      // Draw all currently active sparks
      for (const sp of l.sparks) {
        const age = now - sp.t0;
        const growthPeriod = sp.dur * 0.3; // Shoots forward in first 30% of lifespan
        const growFr = Math.min(1, age / growthPeriod);
        // Fades away in the remaining 70% of lifespan
        const alpha = age < growthPeriod ? 1 : Math.max(0, 1 - (age - growthPeriod) / (sp.dur - growthPeriod));

        if (alpha <= 0 || growFr <= 0) continue;

        renderLightningBolt(ctx, sp.main, growFr, alpha, colors.stem, colors.flower, S);
        if (sp.forks) {
          for (const fork of sp.forks) {
            renderLightningBolt(ctx, fork, growFr, alpha * 0.8, colors.stem, colors.flower, S * 0.7);
          }
        }
      }
    };

    const renderGarden = (B, now, st, customCtx) => {
      const currentCtx = customCtx || (state.mode === 'poster' ? pg : g);
      const S = st.S, L = st.letters, act = L.filter(l => !l.dead), sp = st.speed || 1;
      cc = st.C; _now = now; if (st.face) perch = [];

      // ---------- THEME: ELECTRICITY (PURE YELLOW CRACKLING LIGHTNING) ----------
      if (state.theme === 'electric') {
        // Draw the text
        for (const l of L) {
          if (l.ch !== ' ' && (st.textAll || !l.dead)) {
            B.text(l.ch, l.x, l.y, S, st.C.text);
          }
        }
        // Draw the lightning sparks that grow and dissipate
        for (const l of L) {
          if (l.ch !== ' ') {
            renderElectricSparksForLetter(currentCtx, l, now, S, st.C);
          }
        }
        return;
      }

      // ---------- THEME: GARDEN (ORGANIC PLANTS & FLOWERS) ----------
      if (st.face) {
        for (const l of L) {
          let tx_lean = 0, ty_lean = 0;
          const A = !l.dead && l.ch !== ' ' ? near(l.x, l.y - S * 0.6) : null;
          if (A) {
            const dx = A[0] - l.x, dy = A[1] - (l.y - S * 0.6), d = Math.hypot(dx, dy), reach = Math.max(260, S * 3.2);
            if (d < reach && d > 1) {
