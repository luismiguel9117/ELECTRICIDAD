          const c = l.lean || (l.lean = [0, 0]);
          c[0] += (tx_lean - c[0]) * 0.07;
          c[1] += (ty_lean - c[1]) * 0.07;
        }
      }
      const f = st.boil ? Math.floor(now / 120) : 0;
      const amp = st.boil ? Math.max(0.8, S * 0.01) : 0;
      const kd = l => l.dead ? 1 - eo((now - l.dead) / st.wither) : 1;

      const drawLayer = layer => {
        for (const l of L) {
          if (l.ch === ' ' || !l.els) continue;
          const age = (now - l.birth) * sp, kk = kd(l);
          const each = e => {
            if (e.t === 'stem') drawStem(B, e, l, age, kk, st, f, amp, layer);
            else if (e.layer === layer) drawEl(B, e, l, age, kk, st, f, amp);
          };
          l.els.forEach(each);
          if (l.endEls) l.endEls.forEach(each);
          const i = act.indexOf(l), nx = i >= 0 ? act[i + 1] : null;
          if (l.tend && (l.dead || !nx || nx.ch === ' ')) {
            let fr = eo(((now - l.tb) * sp - 150) / 450);
            if (l.cut != null) fr *= 1 - eo((now - l.cut) * sp / 150) * Math.min(0.85, st.recoil / (0.6 * S));
            for (const e of l.tend) drawStem(B, e, l, age, kk, st, f, amp, layer, fr * kk);
          }
        }
      };

      drawLayer(0);
      for (const l of L) if (l.ch !== ' ' && (st.textAll || !l.dead)) B.text(l.ch, l.x, l.y, S, st.C.text);
      drawLayer(1);
    };

    const paint = (now, caret) => {
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      const palObj = getPal();
      g.fillStyle = palObj.bg;
      g.fillRect(0, 0, W, H);
      const B = backend(g);
      const st = {
        letters,
        S: Sd,
        C: palObj.C,
        boil: state.boil ?? true,
        recoil: state.recoil ?? 20,
        speed: 1,
        wither: state.theme === 'electric' ? 160 : 260,
        face: true
      };

      renderGarden(B, now, st, g);
      drawFlies(B, now, st.C);
      drawInteractiveArc(g, now, st.C);

      // Dropped gift nodes / double-tap
      if (caret && gifts && gifts.length) {
        const LIFE = 60000;
        gifts = gifts.filter(gf => now - gf.t0 < LIFE);
        for (const gf of gifts) {
          const age = now - gf.t0, w = 1 - eo((age - (LIFE - 2200)) / 2200);
          g.globalAlpha = Math.max(0, w);
          if (state.theme === 'electric') {
            // High-voltage lightning burst ring
            const r_circ = Sd * 0.25;
            const pts = [];
            for (let i = 0; i <= 10; i++) {
              const th = i / 10 * Math.PI * 2;
              const rad = r_circ * (0.8 + 0.3 * Math.sin(now * 0.03 + i));
              pts.push([gf.x * W + Math.cos(th) * rad, gf.y * H + Math.sin(th) * rad]);
            }
            renderLightningBolt(g, pts, 1, w, st.C.stem, st.C.flower, Sd);
          } else {
            rose(B, gf.x * W, gf.y * H + (1 - w) * Sd * 0.3, Sd * 0.24 * (0.65 + 0.35 * w), gf.rot + (1 - w) * 0.6, gf.e, age, null);
          }
        }
        g.globalAlpha = 1;
      }

      // Blinking typing caret
      if (caret) {
        const S = Sd;
        const on = now - lastKey < 500 || Math.floor(now / (state.theme === 'electric' ? 320 : 530)) % 2 === 0;
        const hf = eo((now - t0) / 600);
        if (on && hf > 0) {
          const h_bar = 0.8 * S * hf, w_bar = Math.max(2, S * 0.03);
          B.rect(cx - w_bar / 2, cy - h_bar / 2, w_bar, h_bar, st.C.text);
        }
      }
    };

    // ---------- POSTER ANIMATION ENGINE ----------
    const getPreset = () => {
      const list = getPresetsList();
      return list.find(p => p.id === state.preset) || list[0];
    };

    const buildPoster = () => {
      const pr = getPreset(), text = (state.text || '').slice(0, 40) || ' ';
      rand = rng(state.seed * 7919 + 1);
      const L = []; let prev = null, uid_p = 1;
      for (const ch of text) {
        if (ch === ' ') {
          const sp = { ch: ' ', id: 9000 + uid_p++, els: [] };
          L.push(sp); prev = sp; continue;
        }
        const same = prev && prev.ch !== ' ';
        const l = {
          ch,
          id: 9000 + uid_p++,
          ws: same ? prev.ws : Math.floor(rand() * 1e9),
          wi: same ? prev.wi + 1 : 0,
          prev: same ? prev : null
        };
        gen(l); L.push(l); prev = l;
      }
      const n = L.length;
      const step = pr.id === 'grow' ? Math.min(110, 3000 / n) : pr.id === 'typed' ? Math.min(85, 3600 / n) : 0;
      const off = pr.id === 'grow' ? 200 : pr.id === 'typed' ? 300 : 0;
      L.forEach((l, i) => { l.b = off + i * step; });
      if (pr.id === 'scatter') {
        const r_sc = rng(state.seed * 31 + 5);
        L.forEach(l => { l.b = 150 + r_sc() * 2400; });
      }
      const wd = Math.min(60, 900 / n);
      L.forEach((l, i) => {
        l.d = pr.id === 'scatter' ? 4700 + i * 8 : 4200 + (n - 1 - i) * wd;
        const nx = L[i + 1];
        l.cutRel = null;
        if (pr.id !== 'scatter' && l.ch !== ' ' && nx && nx.ch === ' ') {
          l.cutRel = Math.max(30, nx.b - l.b);
          genEnd(l, l.cutRel);
        }
      });
      rand = Math.random;

      const res = layoutCore(L, 1080, 1080, false);
      let S = res.S, x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      const addP = (l, x, y, r_rad) => {
        const X = l.tx + x * S, Y = l.ty + y * S, R_val = (r_rad || 0) * S;
        x0 = Math.min(x0, X - R_val); x1 = Math.max(x1, X + R_val);
        y0 = Math.min(y0, Y - R_val); y1 = Math.max(y1, Y + R_val);
      };

      for (const l of L) {
        if (l.ch === ' ') continue;
        addP(l, -l.tw / S / 2, -0.75); addP(l, l.tw / S / 2, 0.1);
        const all = [...(l.els || []), ...(l.endEls || [])];
        for (const e of all) {
          if (e.t === 'stem') e.pts.forEach(q => addP(l, q[0], q[1], 0.02));
          else if (e.t === 'leaf') addP(l, e.x, e.y, e.L);
          else addP(l, e.x, e.y, e.R * 1.15);
        }
      }

      let tx0 = 1e9, tx1 = -1e9, ty0 = 1e9, ty1 = -1e9;
      for (const l of L) if (l.ch !== ' ') {
        tx0 = Math.min(tx0, l.tx - l.tw / 2); tx1 = Math.max(tx1, l.tx + l.tw / 2);
        ty0 = Math.min(ty0, l.ty - 0.72 * S); ty1 = Math.max(ty1, l.ty);
      }
      const Z = 1080, half = Z * 0.44, bcx = (tx0 + tx1) / 2, bcy = (ty0 + ty1) / 2;
      const k = Math.min(1.25, half / Math.max(1, bcx - x0, x1 - bcx), half / Math.max(1, bcy - y0, y1 - bcy));
      L.forEach(l => {
        l.tx = Z / 2 + (l.tx - bcx) * k;
        l.ty = Z / 2 + (l.ty - bcy) * k;
        l.tw *= k; l.x = l.tx; l.y = l.ty;
      });
      P = { letters: L, S: S * k, T: pr.T, preset: pr.id };
      pt0 = performance.now();
      posterInfoLabel.textContent = `1:1 · ${pr.T / 1000}s loop · 30 fps`;
    };

    const posterFly = (B, tt, P_info, colors) => {
      const ps = perch.slice().sort((a, b) => a.x - b.x);
      if (!ps.length) return;
      const p1 = ps[Math.floor(ps.length * 0.25)], p2 = ps[Math.min(ps.length - 1, Math.floor(ps.length * 0.75))];
      const A = [-80, 300], s1 = [p1.x, p1.y - p1.R * 0.55], s2 = [p2.x, p2.y - p2.R * 0.55], E = [1160, 260];
      const sz = Math.max(12, P_info.S * 0.09), t = tt / 1000, eo_val = v => eo(Math.max(0, Math.min(1, v)));
      const leg = (a, b, u, lift) => {
        const e = eo_val(u);
        return [a[0] + (b[0] - a[0]) * e, a[1] + (b[1] - a[1]) * e - Math.sin(e * Math.PI) * lift];
      };
      let p_pos, flying = true, vx = 0;
      if (t < 1.8) { p_pos = leg(A, s1, t / 1.8, 160); vx = 1; }
      else if (t < 3.4) { p_pos = s1; flying = false; }
      else if (t < 4.6) { p_pos = leg(s1, s2, (t - 3.4) / 1.2, 140); vx = s2[0] > s1[0] ? 1 : -1; }
      else if (t < 5.8) { p_pos = s2; flying = false; }
      else { p_pos = leg(s2, E, (t - 5.8) / 1.2, 60); vx = 1; }

      let o, ang;
      if (flying) {
        o = Math.abs(Math.cos(t * 17));
        p_pos = [p_pos[0] + Math.sin(t * 7) * 6, p_pos[1] + Math.sin(t * 13) * 4];
        ang = vx * 0.3;
      } else {
        const burst = (t > 2.4 && t < 2.8) || (t > 5 && t < 5.3);
        o = burst ? 0.2 + 0.8 * Math.abs(Math.cos(t * 9)) : 0.3 + 0.1 * Math.sin(t * 3);
        ang = 0;
      }

      if (state.theme === 'electric') {
        electricSparkWisp(pg, p_pos[0], p_pos[1], sz, tt);
      } else {
        butterfly(B, p_pos[0], p_pos[1], sz, ang, o, colors);
      }
    };

    const bars = (B, P_info, st, spread, hf) => {
      const S = P_info.S, byLine = {};
      for (const l of P_info.letters) {
        if (l.ch === ' ') continue;
        const b = byLine[l.line] || (byLine[l.line] = { a: 1e9, z: -1e9, y: l.ty });
        b.a = Math.min(b.a, l.tx - l.tw / 2);
        b.z = Math.max(b.z, l.tx + l.tw / 2);
      }
      const w = Math.max(2, S * 0.035), h_bar = 1.0 * S * hf;
      for (const k in byLine) {
        const b = byLine[k], cx_line = (b.a + b.z) / 2, half = (b.z - b.a) / 2 + 0.14 * S, cy_line = b.y - 0.33 * S;
        B.rect(cx_line - half * spread - w / 2, cy_line - h_bar / 2, w, h_bar, st.C.text);
        B.rect(cx_line + half * spread - w / 2, cy_line - h_bar / 2, w, h_bar, st.C.text);
      }
    };

    const posterDraw = (ctx, t) => {
      if (!P) return;
      const Z = 1080, pc = getPal();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = pc.bg;
      ctx.fillRect(0, 0, Z, Z);

      const tt = ((t % P.T) + P.T) % P.T, L = P.letters, B = backend(ctx);
      const st = {
        letters: L,
        S: P.S,
        C: pc.C,
        boil: state.boil ?? true,
        recoil: state.recoil ?? 20,
        speed: 1,
        wither: 600,
        textAll: true
      };
      L.forEach(l => { l.x = l.tx; l.y = l.ty; l.dead = null; });
      const setBase = base => L.forEach(l => {
        l.birth = base + l.b;
        l.tb = l.birth;
        l.cut = l.cutRel != null ? l.birth + l.cutRel : null;
      });

      let bars_val = null;
      if (P.preset === 'breathe') {
        setBase(-1e5);
        const ph = tt / P.T * Math.PI * 2, S = P.S;
        st.warp = (x, y, l) => {
          const h_val = Math.max(0, (l.y - y) / S);
          return [
            x + Math.sin(ph + l.x * 0.004 + h_val * 1.1) * S * 0.03 * h_val,
            y + Math.cos(ph + x * 0.003) * S * 0.008 * h_val
          ];
        };
        st.rotw = e => Math.sin(ph + e.id * 0.7) * 0.12;
      } else if (P.preset === 'grow' || P.preset === 'scatter') {
        setBase(0);
        L.forEach(l => { if (tt >= l.d) l.dead = l.d; });
      } else if (P.preset === 'wind') {
        setBase(-1e5);
        const S = P.S, u = tt / P.T, front = -0.35 + u * 1.9;
        st.warp = (x, y, l) => {
          const hh = Math.max(0, (l.y - y) / S), d = l.x / 1080 - front;
          const g_wind = d < 0 ? Math.exp(d * 2.2) * Math.cos(-d * 9) : Math.exp(-d * d * 30);
          const idle = Math.sin(tt / 1000 * 1.6 + l.x * 0.01) * 0.012;
          return [
            x + (g_wind * 0.13 + idle) * S * hh * hh * 0.6 + (g_wind * 0.13 + idle) * S * hh * 0.4,
            y + Math.abs(g_wind) * 0.02 * S * hh
          ];
        };
        st.rotw = e => {
          const d = e.x / 1080 - front;
          return (d < 0 ? Math.exp(d * 2.2) * Math.cos(-d * 9) : Math.exp(-d * d * 30)) * 0.35;
        };
      } else if (P.preset === 'reach') {
        setBase(-1e5);
        const S = P.S, ph = tt / P.T * Math.PI * 2, lx = 540 + Math.sin(ph) * 430, ly = 540 + Math.sin(ph * 2) * 260;
        _light = [lx, ly];
        st.warp = (x, y, l) => {
          const dx = lx - l.x, dy = ly - (l.y - S * 0.6), d = Math.hypot(dx, dy) || 1, w = Math.max(0, 1 - d / 560), s = w * w * (3 - 2 * w);
          const hh = Math.min(2.5, Math.max(0, (l.y - y) / S)), f = hh * hh * 0.5 + hh * 0.5;
          return [x + dx / d * s * S * 0.12 * f, y + dy / d * s * S * 0.06 * f];
        };
        st.rotw = e => { const a = Math.atan2(ly - e.y, lx - e.x); return Math.sin(a) * 0.15; };
      } else if (P.preset === 'visit') {
        setBase(-1e5);
        st.perchOn = true; perch = [];
        const ph = tt / P.T * Math.PI * 2;
        st.warp = (x, y, l) => {
          const hh = Math.max(0, (l.y - y) / P.S);
          return [x + Math.sin(ph + l.x * 0.004 + hh) * P.S * 0.015 * hh, y];
        };
      } else { // 'typed'
        if (tt >= 4400) return;
        setBase(0);
        st.letters = L.filter(l => tt >= l.birth);
        st.textAll = false;
      }

      renderGarden(B, tt, st, pg);
      if (bars_val != null) bars(B, P, st, bars_val, 1);
      if (P.preset === 'reach') {
        const [lx, ly] = _light, r_light = P.S * 0.09;
        ctx.save();
        ctx.shadowColor = st.C.flower;
        ctx.shadowBlur = 16;
        ctx.fillStyle = st.C.flower;
        ctx.beginPath();
        ctx.arc(lx, ly, r_light, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      if (P.preset === 'visit') posterFly(B, tt, P, st.C);
      if (P.preset === 'typed') {
        const born = st.letters, last = born[born.length - 1], S = P.S;
        if (Math.floor(tt / 400) % 2 === 0 || (last && tt - last.birth < 300)) {
          const x = last ? last.tx + last.tw / 2 + 0.07 * S : 540, y = last ? last.ty - 0.33 * S : 540;
          const w = Math.max(2, S * 0.03), h_bar = 0.8 * S;
          B.rect(x - w / 2, y - h_bar / 2, w, h_bar, st.C.text);
        }
      }
    };

    // ---------- MAIN ANIMATION LOOP ----------
    const frame = () => {
      requestAnimationFrame(frame);
      const now = performance.now();
      const dt = Math.min(64, now - (lt || now));
      lt = now;

      if (state.mode === 'poster') {
        if (!state.busy) posterDraw(pg, now - (pt0 || 0));
        return;
      }

      const k = 1 - Math.exp(-dt / 80);
      Sd += (St - Sd) * k;
      cx += (ctx_ - cx) * k;
      cy += (cty - cy) * k;
      for (const l of letters) {
        if (!l.dead && l.tx != null) {
          l.x += (l.tx - l.x) * k;
          l.y += (l.ty - l.y) * k;
        }
      }
      letters = letters.filter(l => !(l.dead && now - l.dead > 300));
      liveStep(now, dt);
      paint(now, true);
    };

    // ---------- TEXT & KEYBOARD INPUT ----------
    const wither = now => {
      const A = letters.filter(l => !l.dead), last = A[A.length - 1];
      if (!last) return;
      last.dead = now;
      if (state.theme === 'electric') {
        // Fast dying spark burst on backspace
        for (let i = 0; i < 4; i++) {
          spawnSparkForLetter(last, now + i * 15, Sd || 100);
        }
      }
      const pv = A[A.length - 2];
      if (pv && pv.ch !== ' ') { pv.cut = null; pv.endEls = null; pv.tb = now; }
      layout();
    };

    const addLetter = (ch, now) => {
      const A = letters.filter(l => !l.dead), last = A[A.length - 1];
      if (ch === ' ') {
        if (last && last.ch !== ' ') { last.cut = now; genEnd(last, now - last.birth); }
        letters.push({ ch: ' ', id: uid++, birth: now, els: [], sparks: [] });
        layout();
        return;
      }
      const same = last && last.ch !== ' ';
      const l = {
        ch,
        id: uid++,
        birth: now,
        tb: now,
        ws: same ? last.ws : Math.floor(rand() * 1e9),
        wi: same ? last.wi + 1 : 0,
        prev: same ? last : null
      };
      gen(l);
      letters.push(l);
      layout();
    };

    const markKey = () => {
      lastKey = performance.now();
      _kd = true;
      setTimeout(() => { _kd = false; }, 0);
    };

    const handleKey = e => {
      if (state.mode !== 'type') return;
      if (e.metaKey || e.ctrlKey || e.altKey) {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') {
          e.preventDefault();
          e.shiftKey ? saveSVG() : savePNG();
        }
        return;
      }
      if (e.target && (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') && e.target !== hiddenInput) return;
      const now = performance.now();
      const A = letters.filter(l => !l.dead), last = A[A.length - 1];

      if (e.key === 'Backspace') {
        e.preventDefault();
        markKey();
        if (!last) return;
        wither(now);
        return;
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        markKey();
        letters = [];
        layout();
        return;
      }
      if (e.key.length !== 1) return;
      e.preventDefault();
      markKey();
      addLetter(e.key, now);
    };

    const inputDiff = el => {
      if (state.mode !== 'type' || _kd) {
        iv = composing ? el.value : SENT;
        if (!composing) el.value = SENT;
        return;
      }
      const oldVal = iv == null ? SENT : iv, curVal = el.value;
      let p = 0;
      while (p < oldVal.length && p < curVal.length && oldVal[p] === curVal[p]) p++;
      let dels = oldVal.length - p;
      if (p === 0 && oldVal[0] === SENT && oldVal.length > 1) dels -= 1;
      const now = performance.now();
      lastKey = now;
      for (let i = 0; i < dels; i++) wither(now);
      for (const ch of curVal.slice(p)) {
        if (ch === SENT) continue;
        if (ch.charCodeAt(0) === 10) { letters = []; layout(); } else addLetter(ch, now);
      }
      if (composing) iv = curVal;
      else { el.value = SENT; iv = SENT; }
    };

    const refocus = () => {
      if (ptype === 'mouse' && state.mode === 'type' && hiddenInput) {
        hiddenInput.focus({ preventScroll: true });
      }
    };

    // ---------- BROADCAST LIVE MULTIPLAYER ----------
    const liveInit = () => {
      let bc = null;
      try {
        bc = new BroadcastChannel('tg-live');
      } catch (err) {}
      if (!bc) return;

      const rosterMap = new Map();
      const publish = () => {
        const now = Date.now(), out = {};
        for (const [k, v] of rosterMap) {
          if (now - v.t > 3500) rosterMap.delete(k);
          else out[k] = { n: v.n, c: v.c };
        }
        livePresence(out);
      };
      const beat = () => {
        rosterMap.set(me.id, { n: me.n, c: me.c, t: Date.now() });
        bc.postMessage({ k: 'hello', id: me.id, n: me.n, c: me.c });
        publish();
      };
      bc.onmessage = ({ data: d }) => {
        if (d.k === 'hello') {
          const had = rosterMap.has(d.id);
          rosterMap.set(d.id, { n: d.n, c: d.c, t: Date.now() });
          if (!had) publish();
        } else if (d.k === 'bye') {
          rosterMap.delete(d.id);
          publish();
        } else if (d.k === 'p') {
          livePeer(d.payload);
        } else if (d.k === 'r') {
          liveRose(d.payload);
        }
      };
      beat();
      const beatInterval = setInterval(beat, 1000);
      net = {
        send: (ev, payload) => bc.postMessage({ k: ev, payload }),
        close: () => {
          bc.postMessage({ k: 'bye', id: me.id });
          clearInterval(beatInterval);
          bc.close();
        }
      };
    };

    const livePresence = meta => {
      roster = meta || {};
      const n = new Set([...Object.keys(roster), me.id]).size;
      others = n - 1;
      for (const id of [...peers.keys()]) if (!roster[id]) peerDrop(id);
      for (const [id, p] of peers) {
        const r = roster[id];
        if (r && (r.n !== p.n || r.c !== p.c)) peerStyle(p, r);
      }
      const unitLabel = state.theme === 'electric' ? 'sparks connected' : 'gardeners here';
      gardenerCountEl.textContent = n > 1 ? `${n} ${unitLabel}` : '';
    };

    const livePeer = d => {
      if (!d || typeof d.i !== 'string' || d.i === me.id) return;
      let p = peers.get(d.i);
      if (!p) {
        if (peers.size >= 40) return;
        p = peerMake(d.i);
      }
      p.t = performance.now();
      p.h = !!d.h;
      if (!d.h && typeof d.x === 'number' && typeof d.y === 'number') {
        p.tx = Math.min(1.02, Math.max(-0.02, d.x));
        p.ty = Math.min(1.02, Math.max(-0.02, d.y));
        if (p.x == null) { p.x = p.tx * W; p.y = p.ty * H; }
      }
    };

    const peerMake = id => {
      const el = document.createElement('div');
      el.className = 'tg-peer';
      el.style.opacity = '0';
      el.innerHTML = '<svg width="18" height="20" viewBox="0 0 18 20"><path d="M1 1L1 16L5.5 12L8.5 19L11.5 17.6L8.6 11H15Z" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg><span></span>';
      peersContainer.appendChild(el);
      const p = { id, el, x: null, y: null, tx: 0, ty: 0, t: 0, h: true, op: 0 };
      peers.set(id, p);
      peerStyle(p, roster[id] || {});
      return p;
    };

    const peerStyle = (p, r) => {
      p.n = r.n || 'visitor';
      p.c = /^#[0-9A-Fa-f]{6}$/.test(r.c || '') ? r.c : '#FFE600';
      p.el.querySelector('path').setAttribute('fill', p.c);
      const s = p.el.querySelector('span');
      s.textContent = p.n;
      s.style.background = p.c;
    };

    const peerDrop = id => {
      const p = peers.get(id);
      if (p) { p.el.remove(); peers.delete(id); }
    };

    const liveStep = (now, dt) => {
      const N = others + 1, iv_time = Math.min(10000, Math.max(125, (1000 * N * N) / 40));
      if (net && others > 0 && mx != null && !document.hidden && now - lastSend >= iv_time) {
        const x = Math.round((mx / W) * 1000) / 1000, y = Math.round((my / H) * 1000) / 1000;
        if (x !== sentX || y !== sentY) {
          lastSend = now; sentX = x; sentY = y;
          net.send('p', { i: me.id, x, y });
        }
      }
      if (!peers.size) return;
      const tau = Math.min(900, Math.max(70, 0.55 * iv_time)), k = 1 - Math.exp(-dt / tau);
      let shown = 0;
      for (const p of [...peers.values()].sort((a, b) => b.t - a.t)) {
        const idle = now - p.t, vis = !p.h && p.x != null && idle < 45000 && shown < 24;
        if (vis) {
          shown++;
          p.x += (p.tx * W - p.x) * k;
          p.y += (p.ty * H - p.y) * k;
          p.el.style.transform = `translate(${p.x.toFixed(1)}px,${p.y.toFixed(1)}px)`;
        }
        const op = !vis ? 0 : idle < 8000 ? 1 : 0.35;
        if (p.op !== op) { p.op = op; p.el.style.opacity = String(op); }
      }
    };

    const liveRose = g_gift => {
      if (!g_gift || typeof g_gift.x !== 'number' || typeof g_gift.y !== 'number') return;
      const r = rng((g_gift.s | 0) || 1);
      gifts.push({
        x: Math.min(1, Math.max(0, g_gift.x)),
        y: Math.min(1, Math.max(0, g_gift.y)),
        t0: performance.now(),
        rot: (r() - 0.5) * 0.8,
        e: { ph1: r() * 6.283, ph2: r() * 6.283, turns: 1.4 + r() * 0.5 }
      });
      if (gifts.length > 14) gifts.shift();
    };

    // ---------- EXPORT FUNCTIONS (PNG, SVG, VIDEO, FRAMES ZIP) ----------
    const downloadBlob = (blob, filename) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    };

    const savePNG = () => {
      paint(performance.now(), false);
      mainCanvas.toBlob(blob => {
        if (blob) downloadBlob(blob, `${state.theme}-export.png`);
      });
      refocus();
    };

    const saveSVG = () => {
      const parts = [], n = v => Math.round(v * 100) / 100;
      const palObj = getPal();
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

      for (const l of letters) {
        if (l.ch !== ' ' && !l.dead) {
          parts.push(`<text x="${n(l.x)}" y="${n(l.y)}" text-anchor="middle" font-family="${FONT_FAMILY}" font-weight="700" font-size="${n(Sd)}" fill="${palObj.C.text}">${esc(l.ch)}</text>`);
        }
      }

      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${n(W)}" height="${n(H)}" viewBox="0 0 ${n(W)} ${n(H)}"><defs><style>@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;display=swap');</style></defs><rect width="100%" height="100%" fill="${palObj.bg}"/>${parts.join('')}</svg>`;
      downloadBlob(new Blob([svg], { type: 'image/svg+xml' }), `${state.theme}-export.svg`);
      refocus();
    };

    const createZip = files => {
      const crcTable = (() => {
        const t = new Uint32Array(256);
        for (let i = 0; i < 256; i++) {
          let c = i;
          for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
          t[i] = c >>> 0;
        }
        return t;
      })();
      const getCRC = data => {
        let c = 0xFFFFFFFF;
        for (let i = 0; i < data.length; i++) c = crcTable[(c ^ data[i]) & 255] ^ (c >>> 8);
        return (c ^ 0xFFFFFFFF) >>> 0;
      };

      const enc = new TextEncoder(), parts = [], cen = [];
      let off = 0;
      for (const f of files) {
        const nameBytes = enc.encode(f.name), cr = getCRC(f.data), sz = f.data.length;
        const h_hdr = new DataView(new ArrayBuffer(30));
        h_hdr.setUint32(0, 0x04034b50, true);
        h_hdr.setUint16(4, 20, true);
        h_hdr.setUint16(8, 0, true);
        h_hdr.setUint16(12, 33, true);
        h_hdr.setUint32(14, cr, true);
        h_hdr.setUint32(18, sz, true);
        h_hdr.setUint32(22, sz, true);
        h_hdr.setUint16(26, nameBytes.length, true);
        parts.push(h_hdr.buffer, nameBytes, f.data);

        const c_hdr = new DataView(new ArrayBuffer(46));
        c_hdr.setUint32(0, 0x02014b50, true);
        c_hdr.setUint16(4, 20, true);
        c_hdr.setUint16(6, 20, true);
        c_hdr.setUint16(14, 33, true);
        c_hdr.setUint32(16, cr, true);
        c_hdr.setUint32(20, sz, true);
        c_hdr.setUint32(24, sz, true);
        c_hdr.setUint16(28, nameBytes.length, true);
        c_hdr.setUint32(42, off, true);
        cen.push(c_hdr.buffer, nameBytes);

        off += 30 + nameBytes.length + sz;
      }
      const cs = cen.reduce((s, b) => s + (b.byteLength || b.length), 0);
      const e_hdr = new DataView(new ArrayBuffer(22));
      e_hdr.setUint32(0, 0x06054b50, true);
      e_hdr.setUint16(8, files.length, true);
      e_hdr.setUint16(10, files.length, true);
      e_hdr.setUint32(12, cs, true);
      e_hdr.setUint32(16, off, true);
      return new Blob([...parts, ...cen, e_hdr.buffer], { type: 'application/zip' });
    };

    const getFilename = () => {
      const txt = (state.text || 'loop').trim().replace(/[^a-z0-9]+/gi, '-').toLowerCase().slice(0, 24);
      return `${state.theme}-${txt}-${state.preset}`;
    };

    const exportVideo = async () => {
      if (!vmime || state.busy) {
        exportStatus.textContent = 'Video export isn’t supported in this browser — use PNG frames.';
        return;
      }
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const ctx = c.getContext('2d'), stream = c.captureStream(0), track = stream.getVideoTracks()[0];
      const rec = new MediaRecorder(stream, { mimeType: vmime, videoBitsPerSecond: 14e6 }), chunks = [];
      rec.ondataavailable = e => e.data && e.data.size && chunks.push(e.data);
      const done = new Promise(r => { rec.onstop = r; });

      state.busy = true;
      btnExportVideo.disabled = true;
      btnExportFrames.disabled = true;
      exportStatus.textContent = 'Recording loop…';
      posterDraw(ctx, 0);
      rec.start();

      const N = Math.round(P.T / 1000 * 30), wait = ms => new Promise(r => setTimeout(r, ms));
      const startT = performance.now();
      for (let i = 0; i < N; i++) {
        posterDraw(ctx, i * 1000 / 30);
        if (track.requestFrame) track.requestFrame();
        if (i % 15 === 0) exportStatus.textContent = `Recording ${Math.round(i / N * 100)}%`;
        const target = startT + (i + 1) * 1000 / 30;
        await wait(Math.max(0, target - performance.now()));
      }
      rec.stop();
      await done;

      const ext = vmime.includes('mp4') ? 'mp4' : 'webm';
      downloadBlob(new Blob(chunks, { type: vmime.split(';')[0] }), `${getFilename()}.${ext}`);
      state.busy = false;
      btnExportVideo.disabled = false;
      btnExportFrames.disabled = false;
      exportStatus.textContent = `Saved ${ext.toUpperCase()} · ${N} frames`;
    };

    const exportFrames = async () => {
      if (state.busy) return;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const ctx = c.getContext('2d'), N = Math.round(P.T / 1000 * 30), files = [];

      state.busy = true;
      btnExportVideo.disabled = true;
      btnExportFrames.disabled = true;
      exportStatus.textContent = 'Rendering frames…';

      for (let i = 0; i < N; i++) {
        posterDraw(ctx, i * 1000 / 30);
        const b = await new Promise(r => c.toBlob(r, 'image/png'));
        files.push({
          name: `frame_${String(i + 1).padStart(4, '0')}.png`,
          data: new Uint8Array(await b.arrayBuffer())
        });
        if (i % 10 === 0) exportStatus.textContent = `Rendering ${Math.round(i / N * 100)}%`;
      }
      downloadBlob(createZip(files), `${getFilename()}-frames.zip`);
      state.busy = false;
      btnExportVideo.disabled = false;
      btnExportFrames.disabled = false;
      exportStatus.textContent = `Saved ${N} PNG frames · 30 fps`;
    };

    // ---------- UI SETUP & EVENT LISTENERS ----------
    const updatePaletteUI = () => {
      const palObj = getPal();
      appEl.style.backgroundColor = palObj.bg;
      mainCanvas.style.backgroundColor = palObj.bg;
      typeBar.style.color = palObj.C.text;
      paletteBar.style.backgroundColor = palObj.bg;

      // Update palette swatches in bottom bar
      paletteBar.innerHTML = '';
      const list = getPalettesList();
      list.forEach((p, idx) => {
        const btn = document.createElement('button');
        btn.className = `swatch-btn ${idx === state.palette ? 'active' : ''}`;
        btn.title = p[0];
        btn.style.background = p[1];
        btn.style.border = `1.5px solid ${idx === state.palette ? palObj.C.text : (p[1] === palObj.bg ? '#3A3A3A' : 'transparent')}`;
        btn.innerHTML = `<span class="swatch-dot" style="background:${p[2]}"></span>`;
        btn.onclick = e => {
          e.stopPropagation();
          state.palette = idx;
          updatePaletteUI();
          if (state.mode === 'poster') buildPoster();
          refocus();
        };
        paletteBar.appendChild(btn);
      });

      // Update palette cards in poster view
      posterPaletteGrid.innerHTML = '';
      list.forEach((p, idx) => {
        const card = document.createElement('button');
        card.className = `palette-card ${idx === state.palette ? 'active' : ''}`;
        card.innerHTML = `
          <div class="palette-card-preview" style="background:${p[1]}">
            <span class="palette-flower-circle" style="background:${p[2]}"></span>
            <span class="palette-stem-circle" style="background:${p[3]}"></span>
            <span class="palette-type-preview" style="color:${p[5]}">Aa</span>
          </div>
          <span style="padding:0 4px">${p[0]}</span>
        `;
        card.onclick = () => {
          state.palette = idx;
          updatePaletteUI();
          buildPoster();
        };
        posterPaletteGrid.appendChild(card);
      });
    };

    const updatePresetUI = () => {
      presetGrid.innerHTML = '';
      const list = getPresetsList();
      list.forEach(pr => {
        const card = document.createElement('button');
        card.className = `preset-card ${pr.id === state.preset ? 'active' : ''}`;
        card.innerHTML = `
          <span class="title">${pr.label}</span>
          <span class="sub">${pr.sub}</span>
        `;
        card.onclick = () => {
          state.preset = pr.id;
          updatePresetUI();
          buildPoster();
        };
        presetGrid.appendChild(card);
      });
    };

    const updateHintsUI = () => {
      if (state.theme === 'electric') {
        hintType.textContent = 'type to spark';
        hintTap.textContent = 'tap to spark';
        hintCut.textContent = 'space discharges';
        hintWither.textContent = 'backspace snaps';
        hintWitherC.textContent = '⌫ snaps';
        hintClear.textContent = 'enter grounds';
        hintClearC.textContent = 'return grounds';
      } else {
        hintType.textContent = 'type to grow';
        hintTap.textContent = 'tap to type';
        hintCut.textContent = 'space cuts';
        hintWither.textContent = 'backspace withers';
        hintWitherC.textContent = '⌫ withers';
        hintClear.textContent = 'enter clears';
        hintClearC.textContent = 'return clears';
      }
    };

    const setTheme = theme => {
      state.theme = theme;
      state.palette = 0;
      state.preset = 'breathe';

      if (theme === 'electric') {
        btnThemeGarden.className = 'theme-btn';
        btnThemeElectric.className = 'theme-btn active electric';
        document.title = 'Electric Spark Type';
      } else {
        btnThemeGarden.className = 'theme-btn active garden';
        btnThemeElectric.className = 'theme-btn';
        document.title = 'Type Garden';
      }

      updateHintsUI();
      updatePaletteUI();
      updatePresetUI();

      // Re-initialize letters for the selected theme
      letters.forEach(l => {
        if (l.ch !== ' ') gen(l);
      });
      layout();
      if (state.mode === 'poster') buildPoster();
      refocus();
    };

    const setMode = mode => {
      state.mode = mode;
      if (mode === 'type') {
        btnModeType.classList.add('active');
        btnModePoster.classList.remove('active');
        mainCanvas.style.display = 'block';
        peersContainer.style.display = 'block';
        typeBar.style.display = 'flex';
        posterView.style.display = 'none';
        appEl.style.cursor = 'text';
        resize();
        refocus();
      } else {
        btnModeType.classList.remove('active');
        btnModePoster.classList.add('active');
        mainCanvas.style.display = 'none';
        peersContainer.style.display = 'none';
        typeBar.style.display = 'none';
        posterView.style.display = 'grid';
        appEl.style.cursor = 'default';
        const currentTypedText = letters.filter(l => !l.dead).map(l => l.ch).join('').trim();
        if (currentTypedText) {
          state.text = currentTypedText;
          posterTextInput.value = currentTypedText;
        }
        buildPoster();
      }
    };

    // Event Bindings
    btnThemeGarden.onclick = () => setTheme('garden');
    btnThemeElectric.onclick = () => setTheme('electric');
    btnModeType.onclick = () => setMode('type');
    btnModePoster.onclick = () => setMode('poster');

    posterTextInput.oninput = e => {
      state.text = e.target.value;
      buildPoster();
    };

    btnReshuffle.onclick = () => {
      state.seed = Math.floor(Math.random() * 1e6);
      buildPoster();
    };

    btnExportVideo.onclick = exportVideo;
    btnExportFrames.onclick = exportFrames;
    btnSavePNG.onclick = savePNG;
    btnSaveSVG.onclick = saveSVG;

    window.addEventListener('resize', resize);
    window.addEventListener('keydown', handleKey);

    window.addEventListener('pointermove', e => {
      mx = e.clientX;
      my = e.clientY;
    });

    document.addEventListener('pointerleave', () => {
      mx = null;
      if (net && others > 0) net.send('p', { i: me.id, h: 1 });
    });

    window.addEventListener('pointerdown', e => {
      ptype = e.pointerType || 'mouse';
      if (state.mode !== 'type') return;
      const isCanvas = e.target === mainCanvas;
      if (isCanvas) {
        spawnFly(e.clientX, e.clientY);
        // Double-click/tap leaves gift
        const now = performance.now(), lp = lastTap;
        lastTap = { t: now, x: e.clientX, y: e.clientY };
        if (lp && now - lp.t < 340 && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) < 40 && now - lastPlant > 1800) {
          lastPlant = now; lastTap = null;
          const g_gift = {
            x: Math.round(e.clientX / W * 1000) / 1000,
            y: Math.round(e.clientY / H * 1000) / 1000,
            s: Math.floor(Math.random() * 1e6)
          };
          liveRose(g_gift);
          if (net) net.send('r', g_gift);
        }
      }
      if (e.target.closest('button') || e.target.closest('input')) return;
      if (hiddenInput && ptype === 'mouse') hiddenInput.focus({ preventScroll: true });
    }, true);

    window.addEventListener('pointerup', e => {
      if (e.pointerType && e.pointerType !== 'mouse') mx = null;
    });
    window.addEventListener('pointercancel', e => {
      if (e.pointerType && e.pointerType !== 'mouse') mx = null;
    });

    hiddenInput.addEventListener('input', e => inputDiff(e.target));
    hiddenInput.addEventListener('compositionstart', () => { composing = true; });
    hiddenInput.addEventListener('compositionend', () => {
      composing = false;
      setTimeout(() => inputDiff(hiddenInput), 0);
    });

    // Touch device support & Visual Viewport
    if (touch) document.documentElement.setAttribute('data-touch', '');
    if (window.visualViewport && touch) {
      let vvMax = 0;
      const syncVV = () => {
        const vv = window.visualViewport;
        vvMax = Math.max(vvMax, vv.height);
        const kb = vvMax - vv.height > 120;
        document.documentElement.style.setProperty('--tg-top', vv.offsetTop + 'px');
        document.documentElement.style.setProperty('--tg-h', vv.height + 'px');
        if (kb) document.documentElement.setAttribute('data-kb', '');
        else document.documentElement.removeAttribute('data-kb');
        resize();
      };
      window.visualViewport.addEventListener('resize', syncVV);
      window.visualViewport.addEventListener('scroll', syncVV);
      syncVV();
    }

    // Video button label update
    btnExportVideo.textContent = vmime ? `Export ${vmime.includes('mp4') ? 'MP4' : 'WebM'} loop` : 'Video export unavailable';
    if (!vmime) btnExportVideo.disabled = true;

    // ---------- INITIALIZATION ----------
    setTheme('electric'); // Start in electric theme as user requested!
    hiddenInput.value = SENT;
    resize();
    liveInit();
    buildPoster();

    // Load fonts and recalculate
    if (document.fonts) {
      document.fonts.load(`700 100px ${FONT_FAMILY}`).then(() => {
        cache = {};
        layout();
        buildPoster();
      }).catch(() => {});
    }

    // Initial word
    const initialWord = "spark";
    const initT = performance.now();
    for (let i = 0; i < initialWord.length; i++) {
      addLetter(initialWord[i], initT + i * 80);
    }

    requestAnimationFrame(frame);
    setTimeout(() => { if (!touch && hiddenInput) hiddenInput.focus({ preventScroll: true }); }, 100);

  })();
  </script>
</body>
</html>
